<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>EXIQO™ · AI-Assisted Software FSD Generation — Solution Architecture</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700;800&family=Manrope:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#020101; --bg2:#07070d; --bg3:#0c0c16;
  --surface:rgba(255,255,255,0.035);
  --surface2:rgba(255,255,255,0.06);
  --border:rgba(255,255,255,0.10);
  --border2:rgba(255,255,255,0.16);
  --text:#ffffff; --muted:#b9bcc6; --muted2:#8a8d99; --faint:#6a6d79;
  --teal:#45D0BD; --blue:#2C84C8; --cyan:#44B6E9;
  --purple:#8258C8; --purple2:#8656FE; --pink:#FF71D7; --accent:#9B5DE5;
  --green:#3ddc97; --amber:#f5b94a; --red:#ff6b6b;
  --grad-teal:linear-gradient(107deg,#45D0BD 0%,#2C84C8 100%);
  --grad-cyan:linear-gradient(90deg,#45D0BD,#44B6E9);
  --grad-purple:linear-gradient(90deg,#8258C8,#2C84C8);
  --grad-icon:linear-gradient(135deg,#8656FE,#FF71D7);
  --grad-head:linear-gradient(90deg,#45D0BD,#44B6E9 55%,#8656FE);
  --shadow:0 18px 50px rgba(0,0,0,.55);
  --glow-teal:0 0 44px rgba(69,208,189,.22);
  --glow-purple:0 0 44px rgba(130,88,200,.24);
  --r:16px; --r-sm:10px; --r-lg:22px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%;background:var(--bg);color:var(--text);
  font-family:"Manrope",system-ui,sans-serif;-webkit-font-smoothing:antialiased;}
body{overflow:hidden;}
h1,h2,h3,h4,.disp{font-family:"Sora",sans-serif;letter-spacing:-.02em;}

/* ====== background field ====== */
.bgfx{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none;}
.bgfx::before{content:"";position:absolute;inset:0;
  background:
   radial-gradient(900px 600px at 12% -8%, rgba(69,208,189,.10), transparent 60%),
   radial-gradient(900px 700px at 100% 0%, rgba(134,86,254,.12), transparent 55%),
   radial-gradient(800px 700px at 80% 110%, rgba(44,132,200,.10), transparent 60%),
   linear-gradient(180deg,#04040a,#020101);}
.bgfx::after{content:"";position:absolute;inset:0;opacity:.5;
  background-image:linear-gradient(rgba(255,255,255,.025) 1px,transparent 1px),
    linear-gradient(90deg,rgba(255,255,255,.025) 1px,transparent 1px);
  background-size:48px 48px;mask-image:radial-gradient(circle at 50% 40%,#000 30%,transparent 78%);}

/* ====== top bar ====== */
.topbar{position:fixed;top:0;left:0;right:0;height:54px;z-index:30;display:flex;align-items:center;
  gap:16px;padding:0 22px;background:rgba(4,4,10,.66);backdrop-filter:blur(14px);
  border-bottom:1px solid var(--border);}
.brand{display:flex;align-items:center;gap:10px;font-family:"Sora";font-weight:800;font-size:16px;letter-spacing:.02em;}
.brand .mark{width:24px;height:24px;border-radius:7px;background:var(--grad-teal);box-shadow:var(--glow-teal);
  display:grid;place-items:center;font-size:13px;color:#02110f;font-weight:800;}
.brand .tm{font-size:9px;vertical-align:super;color:var(--teal);}
.brand .by{color:var(--muted2);font-weight:500;font-size:11px;font-family:"Manrope";margin-left:2px;}
.topttl{font-family:"Manrope";font-size:12px;color:var(--muted2);font-weight:600;margin-left:4px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.topbar .spacer{flex:1}
.docref{font-family:"JetBrains Mono",monospace;font-size:10.5px;color:var(--faint);border:1px solid var(--border);
  padding:4px 9px;border-radius:999px;white-space:nowrap;}
.menubtn{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--muted);cursor:pointer;
  border:1px solid var(--border);padding:6px 11px;border-radius:999px;background:var(--surface);font-weight:600;}
.menubtn:hover{border-color:var(--border2);color:#fff}

/* ====== slide deck ====== */
#deck{position:absolute;inset:54px 0 0 0;z-index:1;}
.slide{position:absolute;inset:0;display:none;flex-direction:column;
  padding:40px 56px 70px;overflow-y:auto;overflow-x:hidden;}
.slide.active{display:flex;animation:fade .5s ease;}
@keyframes fade{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.slide::-webkit-scrollbar{width:9px}
.slide::-webkit-scrollbar-thumb{background:rgba(255,255,255,.13);border-radius:9px}
.slide-inner{width:100%;max-width:1180px;margin:0 auto;}

/* ====== headings / chips ====== */
.chip{display:inline-flex;align-items:center;gap:8px;font-family:"Sora";font-size:11px;font-weight:700;
  letter-spacing:.16em;text-transform:uppercase;padding:6px 13px;border-radius:999px;
  background:var(--surface2);border:1px solid var(--border);color:var(--teal);margin-bottom:16px;}
.chip .dot{width:7px;height:7px;border-radius:50%;background:var(--grad-cyan);box-shadow:0 0 10px var(--teal);}
.chip.purple{color:var(--pink)} .chip.purple .dot{background:var(--grad-icon);box-shadow:0 0 10px var(--purple2)}
.kick{font-family:"JetBrains Mono",monospace;font-size:11px;color:var(--faint);letter-spacing:.05em;}
h2.title{font-size:34px;font-weight:800;line-height:1.08;margin:0 0 8px;}
h2.title .g,.gt{background:var(--grad-head);-webkit-background-clip:text;background-clip:text;color:transparent;}
.sub{font-size:15px;color:var(--muted);max-width:880px;line-height:1.55;margin:0 0 22px;}
.lead{font-size:16px;color:var(--muted);line-height:1.6;}

/* ====== generic layout helpers ====== */
.grid{display:grid;gap:16px}
.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:1fr 1fr 1fr}
.g4{grid-template-columns:repeat(4,1fr)}.g5{grid-template-columns:repeat(5,1fr)}
.row{display:flex;gap:16px}.wrap{flex-wrap:wrap}.center{align-items:center}.between{justify-content:space-between}
.col{display:flex;flex-direction:column;gap:14px}
@media(max-width:1100px){.g3,.g4,.g5{grid-template-columns:1fr 1fr}.slide{padding:34px 30px 70px}}

/* ====== cards ====== */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:18px 18px;
  position:relative;transition:.25s;}
.card:hover{border-color:var(--border2);background:var(--surface2);transform:translateY(-2px);box-shadow:var(--shadow);}
.card h4{margin:0 0 7px;font-size:15px;font-weight:700;}
.card p{margin:0;font-size:13px;color:var(--muted);line-height:1.5;}
.card .ico{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;margin-bottom:12px;
  background:var(--surface2);border:1px solid var(--border);font-size:18px;}
.card.t{border-top:2px solid transparent;border-image:var(--grad-cyan) 1;}
.tag{display:inline-block;font-family:"JetBrains Mono",monospace;font-size:10px;color:var(--teal);
  border:1px solid var(--border);border-radius:6px;padding:2px 7px;margin:2px 4px 2px 0;background:rgba(69,208,189,.06);}
.tag.p{color:var(--pink);background:rgba(255,113,215,.06)}
.tag.b{color:var(--cyan);background:rgba(68,182,233,.06)}
.num{font-family:"Sora";font-weight:800;font-size:30px;background:var(--grad-head);-webkit-background-clip:text;color:transparent;line-height:1;}
.muted{color:var(--muted)} .small{font-size:12px} .xsmall{font-size:11px}
b,strong{color:#fff;font-weight:700}
.hl{color:var(--teal);font-weight:700}.hp{color:var(--pink);font-weight:700}.hb{color:var(--cyan);font-weight:700}

/* ====== pipeline / flow ====== */
.flow{display:flex;align-items:stretch;gap:0;flex-wrap:nowrap;}
.fstep{flex:1;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-sm);
  padding:14px 12px;text-align:center;position:relative;min-width:0;}
.fstep .n{font-family:"JetBrains Mono";font-size:10px;color:var(--faint);}
.fstep .t{font-family:"Sora";font-weight:700;font-size:13px;margin:4px 0 5px;}
.fstep .d{font-size:11px;color:var(--muted2);line-height:1.4}
.fstep .e{font-size:19px;margin-bottom:6px}
.farrow{display:flex;align-items:center;color:var(--teal);font-size:18px;padding:0 7px;flex:0 0 auto}
.fstep.tealtop{border-top:2px solid var(--teal)}.fstep.bluetop{border-top:2px solid var(--blue)}
.fstep.cyantop{border-top:2px solid var(--cyan)}.fstep.purpletop{border-top:2px solid var(--purple2)}
.fstep.pinktop{border-top:2px solid var(--pink)}

/* vertical connectors */
.vflow{display:flex;flex-direction:column;gap:0}
.vstep{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-sm);padding:13px 15px;}
.vconn{height:18px;width:2px;background:linear-gradient(var(--teal),var(--blue));margin:0 auto;position:relative}
.vconn::after{content:"▼";position:absolute;bottom:-4px;left:-5px;color:var(--blue);font-size:11px}

/* ====== decision-flag callout ====== */
.flag{display:flex;gap:12px;align-items:flex-start;background:linear-gradient(90deg,rgba(245,185,74,.10),rgba(245,185,74,.02));
  border:1px solid rgba(245,185,74,.32);border-left:3px solid var(--amber);border-radius:var(--r-sm);
  padding:13px 16px;margin-top:14px;}
.flag .fi{font-size:16px;line-height:1.2}
.flag .ft{font-family:"Sora";font-weight:700;font-size:12px;color:var(--amber);letter-spacing:.04em;text-transform:uppercase;margin-bottom:3px}
.flag p{margin:0;font-size:12.5px;color:var(--muted);line-height:1.5}

/* ====== exec "in plain terms" callout ====== */
.exec{display:flex;gap:12px;align-items:flex-start;background:linear-gradient(90deg,rgba(69,208,189,.12),rgba(68,182,233,.03));
  border:1px solid rgba(69,208,189,.34);border-left:3px solid var(--teal);border-radius:var(--r-sm);
  padding:13px 16px;margin:14px 0;}
.exec .ei{font-size:16px;line-height:1.2}
.exec .et{font-family:"Sora";font-weight:700;font-size:12px;color:var(--teal);letter-spacing:.04em;text-transform:uppercase;margin-bottom:3px}
.exec p{margin:0;font-size:13px;color:#dfe2ea;line-height:1.55}
.exec p b{color:#fff}

/* ====== pills / legend ====== */
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:11.5px;color:var(--muted2);margin-top:10px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.sw{width:11px;height:11px;border-radius:3px;display:inline-block}

/* tables */
table.tb{width:100%;border-collapse:collapse;font-size:12.5px;}
table.tb th{text-align:left;font-family:"Sora";font-size:11px;letter-spacing:.04em;text-transform:uppercase;
  color:var(--teal);padding:9px 12px;border-bottom:1px solid var(--border2);}
table.tb td{padding:9px 12px;border-bottom:1px solid var(--border);color:var(--muted);vertical-align:top;line-height:1.45}
table.tb tr:hover td{background:var(--surface)}
table.tb td b{color:#fff}

/* code-ish block */
.codeblock{background:#06060c;border:1px solid var(--border);border-radius:var(--r-sm);padding:14px 16px;
  font-family:"JetBrains Mono",monospace;font-size:11.5px;color:#cdd2dc;line-height:1.6;overflow-x:auto;white-space:pre;}
.codeblock .k{color:var(--pink)}.codeblock .s{color:var(--teal)}.codeblock .c{color:var(--faint)}.codeblock .n{color:var(--cyan)}

/* metric stat */
.stat{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:16px 18px;text-align:left}
.stat .v{font-family:"Sora";font-weight:800;font-size:26px;background:var(--grad-head);-webkit-background-clip:text;color:transparent;line-height:1}
.stat .l{font-size:11.5px;color:var(--muted2);margin-top:6px;line-height:1.4}

/* note line */
.note{font-size:11.5px;color:var(--faint);margin-top:14px;border-top:1px dashed var(--border);padding-top:10px}

/* ====== controls ====== */
.controls{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);z-index:30;display:flex;align-items:center;
  gap:4px;background:rgba(7,7,14,.8);backdrop-filter:blur(14px);border:1px solid var(--border);
  border-radius:999px;padding:5px 6px;box-shadow:var(--shadow);}
.controls button{background:transparent;border:0;color:var(--muted);width:34px;height:34px;border-radius:50%;
  cursor:pointer;font-size:15px;display:grid;place-items:center;transition:.2s}
.controls button:hover{background:var(--surface2);color:#fff}
.counter{font-family:"JetBrains Mono";font-size:12px;color:var(--muted);min-width:62px;text-align:center}
.counter b{color:#fff}
.progress{position:fixed;top:54px;left:0;height:2px;z-index:31;background:var(--grad-head);width:0;transition:width .4s}

/* slide index overlay */
.overlay{position:fixed;inset:0;z-index:40;background:rgba(2,2,6,.9);backdrop-filter:blur(8px);display:none;
  padding:70px 40px 40px;overflow-y:auto;}
.overlay.open{display:block}
.overlay h3{font-size:13px;color:var(--teal);letter-spacing:.12em;text-transform:uppercase;margin:0 0 18px}
.idxgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px;max-width:1100px;margin:0 auto}
.idxcard{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-sm);padding:13px 15px;cursor:pointer;transition:.2s}
.idxcard:hover{border-color:var(--teal);background:var(--surface2)}
.idxcard .ci{font-family:"JetBrains Mono";font-size:10px;color:var(--faint)}
.idxcard .ct{font-family:"Sora";font-weight:600;font-size:13px;margin-top:4px}
.ovclose{position:fixed;top:16px;right:24px;font-size:24px;color:var(--muted);cursor:pointer;z-index:41}

/* misc badge */
.badge{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:700;font-family:"Sora";
  padding:4px 10px;border-radius:999px;border:1px solid var(--border)}
.badge.tool{color:var(--cyan);background:rgba(68,182,233,.07)}
.badge.hitl{color:var(--pink);background:rgba(255,113,215,.07)}
.badge.auto{color:var(--teal);background:rgba(69,208,189,.07)}

.divider{height:1px;background:var(--border);margin:18px 0}
.hidehint{position:fixed;bottom:18px;right:22px;z-index:29;font-size:11px;color:var(--faint);font-family:"JetBrains Mono"}
@media(max-width:900px){.hidehint{display:none}}
</style>
</head>

<template id="slides">

<!-- ░░░ SLIDE 1 — TITLE ░░░ -->
<section class="slide" data-title="Title" data-sec="Cover">
 <div class="slide-inner" style="margin:auto;text-align:center">
   <div class="chip" style="margin-inline:auto"><span class="dot"></span>Solution Architecture · Confidential</div>
   <h1 style="font-size:52px;font-weight:800;line-height:1.05;margin:6px 0 14px">
     AI-Assisted <span class="gt">Software FSD</span><br>Generation Platform</h1>
   <p class="lead" style="max-width:720px;margin:0 auto 26px">
     A grounded, traceable, human-in-the-loop system that turns validated historical engineering
     documentation into reliable <b>draft Functional Specification Documents</b>.</p>
   <div class="row center" style="justify-content:center;gap:14px;flex-wrap:wrap">
     <div class="badge auto">● Technically grounded</div>
     <div class="badge tool">● Fully traceable</div>

     <div><span style="color:var(--faint)">Delivered by</span> &nbsp;<b style="color:#fff">EXIQO™ · R Systems (RSI)</b></div>
     <div><span style="color:var(--faint)">Basis</span> &nbsp;<b style="color:#fff">DOC-100949 Rev A</b></div>
   </div>
 </div>
</section>

<!-- ░░░ SLIDE 2 — WHAT WE UNDERSTAND ░░░ -->
<section class="slide" data-title="What We Understand" data-sec="Context">
 <div class="slide-inner">
  <div class="chip"><span class="dot"></span>What we understand</div>
  <h2 class="title">The problem isn't writing FSDs — it's <span class="g">re-deriving context</span> every time</h2>
  <p class="sub">FSD authorship today is a high-skill, low-leverage activity. The knowledge needed to write a good FSD already
   exists in validated historical documents — but it's locked in unstructured prose, Visio files, and SME memory,
   so every new FSD pays the full interpretation cost again.</p>

  <div class="grid g2" style="align-items:start">
   <div class="col">
     <div class="card t">
       <h4>📌 The current process</h4>
       <p style="margin-bottom:12px">Each FSD is hand-authored by interpreting and reconciling five disconnected inputs:</p>
       <div class="vflow">
         <div class="vstep"><b>Descriptions of Operations (DOOs)</b><div class="small muted">Narrative intent of how the system should operate</div></div>
         <div class="vconn"></div>
         <div class="vstep"><b>Customer Proposals &amp; Job Cost docs</b><div class="small muted">Commercial scope &amp; commitments</div></div>
         <div class="vconn"></div>
         <div class="vstep"><b>Prior FSDs (reuse)</b><div class="small muted">Manually recalled &amp; copy-adapted by SMEs</div></div>
         <div class="vconn"></div>
         <div class="vstep"><b>Visio workflow authoring</b><div class="small muted">Hand-drawn control &amp; process logic</div></div>
         <div class="vconn"></div>
         <div class="vstep" style="border-color:var(--border2);background:var(--surface2)"><b style="color:var(--teal)">→ Draft FSD</b><div class="small muted">Labor-intensive, SME-bound, hard to scale</div></div>
       </div>
     </div>
   </div>

   <div class="col">
     <div class="card" style="border-image:var(--grad-icon) 1;border-top:2px solid transparent">
       <h4>🔬 What the proof-of-concept proved</h4>
       <p>AI <b>can</b> interpret workflows and DOO content reliably — <span class="hl">but only when the input is presented in structured form.</span> Output quality collapses without three things:</p>
       <div class="grid g3" style="margin-top:14px">
         <div class="stat"><div class="v">⚠︎</div><div class="l"><b style="color:#fff">System context</b><br>no sense of where logic applies</div></div>
         <div class="stat"><div class="v">⚠︎</div><div class="l"><b style="color:#fff">Relevance filtering</b><br>can't separate signal from noise</div></div>
         <div class="stat"><div class="v">⚠︎</div><div class="l"><b style="color:#fff">Design rationale</b><br>copies form, misses intent</div></div>
       </div>
     </div>

     <div class="card" style="background:linear-gradient(120deg,rgba(69,208,189,.08),rgba(134,86,254,.06));border-color:var(--border2)">
       <h4>🎯 The objective we are designing to</h4>
       <p style="font-size:14px">This initiative does <b>not</b> aim to fully automate FSD authorship. It aims to generate
       <span class="hl">reliable draft FSD content</span> by grounding every output in a
       <span class="hp">structured, classified, retrievable knowledge base</span> built from validated historical documentation —
       with humans firmly in the loop on the decisions that matter.</p>
     </div>
   </div>
  </div>
  <div class="note">Source basis: DOC-100949 Rev A §3 Problem Context &amp; System Objective, §4 Target Capability. The remainder of this deck is EXIQO's proposed solution architecture against those requirements.</div>
 </div>
</section>

<!-- ░░░ SLIDE 3 — DESIGN PRINCIPLES ░░░ -->
<section class="slide" data-title="Non-Negotiable Design Principles" data-sec="Approach">
 <div class="slide-inner">
  <div class="chip"><span class="dot"></span>Target approach · Foundations</div>
  <h2 class="title">Seven <span class="g">non-negotiable</span> design principles</h2>
  <p class="sub">Before any architecture, we anchor on the properties the system must hold by construction — not as
   features bolted on later. Every downstream design decision is justified against these.</p>

  <div class="grid g4">
   <div class="card t"><div class="ico">🧱</div><h4>Technically grounded drafts</h4><p>Every generated statement traces to a retrieved, validated source element. No free-floating "best practice" prose.</p></div>
   <div class="card t"><div class="ico">🔗</div><h4>Extreme traceability</h4><p>Each FSD line carries citations back to source doc, section/page &amp; version. A reviewer can verify in seconds.</p></div>
   <div class="card t"><div class="ico">📐</div><h4>Structurally consistent</h4><p>Output conforms to the agreed FSD template by construction — enforced via schema, not hope.</p></div>

<section class="slide" data-title="Classification & Intelligence Catalogue" data-sec="02 · Classify">
 <div class="slide-inner">
  <div class="chip purple"><span class="dot"></span>Stage 02 · Classification &amp; metadata</div>
  <h2 class="title">Every artifact is classified — <span class="g">SME-anchored, then auto-attributed at scale</span></h2>
  <p class="sub">Classification is what makes retrieval work on <b>functional intent &amp; system context</b>, not keyword similarity.
   SMEs attribute a gold sample by hand; an LLM classifier learns from those exemplars and auto-attributes the rest, producing a governed <span class="hp">intelligence catalogue</span>.</p>

  <div class="exec"><div class="ei">💡</div><div><div class="et">In plain terms</div>
    <p>Every piece of logic is <b>tagged with what it does and where it applies</b> — like a librarian cataloguing each item — so we can later find the right precedent by meaning and context, not just keywords. SMEs set the standard on a sample; the AI then tags the rest at scale, with anything uncertain sent back for a human check.</p></div></div>

<!-- ░░░ SLIDE 10 — STORAGE ARCHITECTURE (DUAL) ░░░ -->
<section class="slide" data-title="Storage Architecture — Dual Knowledge Graph + Vector" data-sec="03 · Storage">
 <div class="slide-inner">
  <div class="chip"><span class="dot"></span>Stage 03 · Knowledge base &amp; storage</div>
  <h2 class="title">A <span class="g">dual store</span>: knowledge graph for structure, vectors for meaning</h2>
  <p class="sub">Our artifacts aren't flat text — they're <b>connected</b> (step-graphs, branch conditions, component relationships, traceability chains).
   That's exactly where a graph + vector "HybridRAG" design beats pure vector RAG. We recommend co-locating both in one multi-model store to eliminate ID-sync risk against the hard traceability requirement.</p>

  <div class="exec"><div class="ei">💡</div><div><div class="et">In plain terms</div>
    <p>We keep the knowledge two complementary ways: a <b>graph that remembers how everything connects</b> (steps, conditions, constraints, and exactly where each came from) and a <b>vector index that remembers what everything means</b>. The graph lets us trace and follow logic; the vectors let us find similar precedents. Holding both in one database means the two can never drift out of sync — which is what protects traceability.</p></div></div>

         <div class="legend" style="margin-top:4px"><span><span class="sw" style="background:var(--teal)"></span>step flow</span><span><span class="sw" style="background:var(--pink)"></span>classification</span><span><span class="sw" style="background:#888"></span>provenance</span></div>
       </div>

       <!-- VECTOR DB -->
       <div class="card" style="background:rgba(69,208,189,.05);border-color:rgba(69,208,189,.3)">
         <div class="row center between"><h4 style="margin:0">🧮 Vector Index <span class="small muted" style="font-weight:500">HNSW</span></h4><span class="badge auto">semantic recall</span></div>
         <div class="codeblock" style="margin-top:8px;font-size:10px;padding:12px"><span class="c"># one record per component</span>
{
  <span class="k">"id"</span>: <span class="s">"cmp_4471"</span>,        <span class="c"># = KG node_id</span>
  <span class="k">"vector"</span>: [..1024d..],   <span class="c"># desc + rationale</span>
  <span class="k">"payload"</span>: {
     <span class="k">component_type</span>: <span class="s">"ExceptionPath"</span>,
     <span class="k">functional_intent</span>: <span class="s">"sortation"</span>,
     <span class="k">system_type</span>: <span class="s">"unit-sorter"</span>,
     <span class="k">standard_or_custom</span>: <span class="s">"standard"</span>,
     <span class="k">doc</span>: <span class="s">"FSD-2024-117"</span>,
     <span class="k">section</span>: <span class="s">"6.2"</span>, <span class="k">version</span>: <span class="s">"A"</span>
  }
}</div>
         <p class="xsmall" style="margin-top:8px;color:var(--muted)">We embed the <b>natural-language</b> fields (description, SME rationale, step intent). Every classification dimension is a <b>filterable payload field</b>; <span class="hl">node_id</span> ties each vector back to its graph node.</p>
       </div>
     </div>
   </div>
  </div>

  <!-- what each store handles -->
  <div class="grid g4" style="margin-top:16px">
    <div class="card" style="padding:14px"><h4 style="font-size:13px">Metadata filtering</h4><p class="xsmall">Hard applicability constraints as pre-filters; dimensions as node props + concept-node edges.</p></div>
    <div class="card" style="padding:14px"><h4 style="font-size:13px">Graph traversal</h4><p class="xsmall"><span class="hp">NEXT / BRANCHES_TO</span> walks workflow logic; multi-hop reasoning vectors can't express.</p></div>
    <div class="card" style="padding:14px"><h4 style="font-size:13px">Semantic similarity</h4><p class="xsmall">HNSW over embedded descriptions → "find logic like this" despite different wording.</p></div>
    <div class="card" style="padding:14px"><h4 style="font-size:13px">Traceability</h4><p class="xsmall"><span class="hp">SOURCED_FROM</span> → versioned Document nodes; provenance is a first-class, queryable edge.</p></div>
  </div>

  <div class="grid g2" style="margin-top:16px;align-items:start">
    <div class="flag" style="margin-top:0"><div class="fi">📍</div><div><div class="ft">Decision flag · store technology</div>
      <p><b>Primary recommendation: Neo4j</b> (graph + native HNSW vectors in one multi-model store) — removes the graph-id ↔ vector-id sync failure mode, which directly protects traceability. <b>Alternative:</b> PostgreSQL + pgvector + Apache AGE (single DB, lower ops). <b>If vectors are externalized:</b> Qdrant (best-in-class filtered search). Needs your sign-off.</p></div></div>
    <div class="card" style="background:linear-gradient(120deg,rgba(134,86,254,.08),rgba(69,208,189,.05))">
      <h4>Patterns we adopt</h4>
      <p style="margin-bottom:8px"><b>Lexical graph + domain graph layering</b> — Document→Section→Chunk spine (traceability + semantic) cross-linked to typed components, step-graphs &amp; classifications (reasoning structure).</p>
      <p><b>Parent–child chunks</b> — embed precise child chunks for retrieval, return the parent workflow/section for full context. Route <i>simple</i> metadata lookups to filtered vector/SQL, reserve graph traversal for relational queries.</p>
    </div>
  </div>
  <div class="row wrap" style="gap:6px;margin-top:14px"><span class="tag">Neo4j</span><span class="tag b">neo4j-graphrag</span><span class="tag">pgvector + AGE</span><span class="tag b">Qdrant</span><span class="tag p">HybridRAG / GraphRAG</span></div>
 </div>
</section>

<!-- ░░░ SLIDE 11 — RETRIEVAL ARCHITECTURE ░░░ -->
<section class="slide" data-title="Retrieval Architecture" data-sec="04 · Retrieval">
 <div class="slide-inner">
  <div class="chip purple"><span class="dot"></span>Stage 04 · Retrieval</div>
  <h2 class="title">An eight-stage pipeline tuned for <span class="g">accuracy, constraint-correctness &amp; clean failure</span></h2>
  <p class="sub">Retrieval is only as good as what ingestion produced. This pipeline exploits every earlier investment —
   typed components, structured step-graphs, classifications and provenance — to return the <i>right</i> grounded context, predictably, and to abstain cleanly when no precedent exists.</p>

  <div class="exec"><div class="ei">💡</div><div><div class="et">In plain terms</div>
    <p>The system finds precedent <b>the way a senior engineer would</b>: first narrow to what's actually applicable to this system, then find logic that's genuinely similar, pull in the whole connected picture (the related steps, constraints and exceptions), and double-check relevance before using it — and if there's no real match, it says so rather than guessing.</p></div></div>

  <!-- pipeline -->
  <div class="vflow">
    <div class="vstep" style="border-left:3px solid var(--teal)"><div class="row center between"><b>① Intent router</b><span class="small muted">classify &amp; scope · workflow vs constraint vs exception lookup</span></div></div>
    <div class="vconn"></div>
    <div class="vstep" style="border-left:3px solid var(--teal)"><div class="row center between"><b>② Query transform</b><span class="small muted">decompose multi-part requests · optional HyDE for sparse queries</span></div></div>
    <div class="vconn"></div>
    <div class="vstep" style="border-left:3px solid var(--cyan)"><div class="row center between"><b>③ Metadata pre-filter <span class="badge tool" style="margin-left:6px">uses classification</span></b><span class="small muted">hard applicability constraints: system type · config · prereqs · standard-vs-custom</span></div></div>
    <div class="vconn"></div>
    <div class="vstep" style="border-left:3px solid var(--cyan)"><div class="row center between"><b>④ Hybrid retrieve → RRF fusion</b><span class="small muted">dense vectors + BM25 sparse · Reciprocal Rank Fusion (k=60) · ~50 candidates</span></div></div>
    <div class="vconn"></div>
    <div class="vstep" style="border-left:3px solid var(--purple2)"><div class="row center between"><b>⑤ Graph expansion <span class="badge hitl" style="margin-left:6px">uses step-graph</span></b><span class="small muted">vector seeds → traverse KG (NEXT / BRANCHES_TO / constraints / exceptions) to assemble the <i>complete</i> logical unit</span></div></div>
    <div class="vconn"></div>
    <div class="vstep" style="border-left:3px solid var(--pink)"><div class="row center between"><b>⑥ Cross-encoder rerank</b><span class="small muted">joint query+doc scoring · top ~50 → top 5–10 · biggest single precision lift</span></div></div>
    <div class="vconn"></div>
    <div class="vstep" style="border-left:3px solid var(--amber)"><div class="row center between"><b>⑦ Relevance threshold + sufficient-context gate</b><span class="small muted">below cutoff → <span style="color:var(--amber)">"no applicable example — escalate to manual authoring"</span></span></div></div>
    <div class="vconn"></div>
    <div class="vstep" style="border-left:3px solid var(--green);background:var(--surface2)"><div class="row center between"><b>⑧ Assemble grounded context + citations</b><span class="small muted">traceable source-linked context → handed to generation</span></div></div>
  </div>

  <div class="grid g4" style="margin-top:16px">
    <div class="card" style="padding:14px"><h4 style="font-size:13px">Why hybrid</h4><p class="xsmall">Dense catches intent; <b>BM25 catches exact tokens</b> — part codes, function names, clause refs. +15–30% over pure vector.</p></div>
    <div class="card" style="padding:14px"><h4 style="font-size:13px">Why pre-filter</h4><p class="xsmall">Guarantees every candidate is <b>actually applicable</b> to the target system → satisfies "relevant given constraints".</p></div>
    <div class="card" style="padding:14px"><h4 style="font-size:13px">Why rerank</h4><p class="xsmall">Cross-encoder lift ≈ <b>+17pp MRR@3</b> for ~120ms. Highest-leverage single optimization.</p></div>
    <div class="card" style="padding:14px"><h4 style="font-size:13px">Why abstain</h4><p class="xsmall">Reranker scores threshold far better than cosine → <b>clean failure cases</b>, no hallucinated fill.</p></div>
  </div>

  <div class="flag"><div class="fi">📍</div><div><div class="ft">Decision flag · reranker hosting</div>
   <p>For IP-sensitive engineering content we recommend a <b>self-hosted reranker</b> (<span class="hb">bge-reranker-v2-m3</span> or <span class="hb">Jina Reranker v2</span>, &lt;50ms/50 candidates on GPU) over managed APIs (Cohere / Voyage). Threshold τ is calibrated on a labelled FSD set. Confirm data-governance stance.</p></div></div>
  <div class="row wrap" style="gap:6px;margin-top:12px"><span class="tag">RRF fusion</span><span class="tag b">BM25 + dense</span><span class="tag p">VectorCypherRetriever</span><span class="tag b">bge / Jina reranker</span><span class="tag" style="color:var(--amber);background:rgba(245,185,74,.06)">confidence abstention</span></div>
 </div>
</section>

<!-- ░░░ SLIDE 12 — DRAFT FSD GENERATION ░░░ -->
<section class="slide" data-title="Draft FSD Generation" data-sec="05 · Generation">
 <div class="slide-inner">
  <div class="chip"><span class="dot"></span>Stage 05 · Generation</div>
  <h2 class="title">The LLM fills a <span class="g">structured contract</span> — code renders the document</h2>
  <p class="sub">We never ask the model to "write an FSD." The model emits a <b>schema-constrained Pydantic object</b>; a tested,
   deterministic renderer turns it into the agreed FSD template, the Visio-friendly workflow, and a traceability matrix. Structure is guaranteed by construction.</p>

  <!-- generation flow -->
  <div class="flow" style="margin:4px 0 16px">
    <div class="fstep cyantop"><div class="e">📦</div><div class="t">Grounded context</div><div class="d">retrieved components + citations + constraints</div></div>
    <div class="farrow">➜</div>
    <div class="fstep purpletop"><div class="e">🤖</div><div class="t">LLM · constrained decoding</div><div class="d">emits FSD <b>Pydantic</b> object — schema-conformant by construction</div></div>
    <div class="farrow">➜</div>
    <div class="fstep" style="border-top:2px solid var(--amber)"><div class="e">🛡️</div><div class="t">Grounding gate</div><div class="d">every claim cites a chunk; unsupported → flag/abstain</div></div>
    <div class="farrow">➜</div>
    <div class="fstep" style="border-top:2px solid var(--green)"><div class="e">⚙️</div><div class="t">Deterministic renderer</div><div class="d">code → document, diagram &amp; matrix</div></div>
  </div>

  <div class="grid g3" style="align-items:start">
    <!-- schema -->
    <div class="card t">
      <h4>The FSD contract (Pydantic)</h4>
      <div class="codeblock" style="font-size:10px;padding:12px"><span class="k">class</span> <span class="n">FSDSection</span>(BaseModel):
  heading: str
  body: str
  steps: list[<span class="n">FSDStep</span>]
  <span class="s">citations</span>: list[<span class="n">CiteRef</span>]  <span class="c"># req'd</span>
  grounded: bool

<span class="k">class</span> <span class="n">DraftFSD</span>(BaseModel):
  title: str
  sections: list[<span class="n">FSDSection</span>]
  workflow: <span class="n">StepGraph</span>     <span class="c"># →Visio</span>
  open_items: list[str]    <span class="c"># SME</span></div>
      <p class="xsmall" style="margin-top:8px">Constrained decoding compiles the schema into a state machine — invalid tokens are impossible, not improbable.</p>
    </div>

    <!-- outputs -->
    <div class="col">
      <div class="card" style="padding:14px"><h4 style="font-size:13.5px">📄 Draft FSD document</h4><p class="xsmall">Renderer (Jinja2 → docx/PDF) lays out the <b>agreed template</b> — headings, numbering, section order are tested code, not model output.</p></div>
      <div class="card" style="padding:14px"><h4 style="font-size:13.5px">🔷 Visio-friendly workflow</h4><p class="xsmall">Step-graph → <b>Mermaid / BPMN 2.0</b>, exportable to <b>.vsdx</b> &amp; draw.io. The diagram is generated from the same structured object as the prose — they cannot diverge.</p></div>
      <div class="card" style="padding:14px"><h4 style="font-size:13.5px">🔗 Traceability matrix</h4><p class="xsmall">Per-section &amp; per-claim citations → source doc · section/page · version. A reviewer verifies any line in seconds.</p></div>
    </div>

    <!-- grounding -->
    <div class="card" style="background:linear-gradient(120deg,rgba(245,185,74,.08),rgba(255,107,107,.05));border-color:var(--border2)">
      <h4>Anti-hallucination, enforced</h4>
      <div class="vflow" style="margin-top:6px">
        <div class="vstep" style="padding:10px 12px"><b class="small">Citation-enforced</b><div class="xsmall muted">every claim must reference a retrieved chunk id — uncited content is rejected &amp; regenerated</div></div>
        <div class="vconn"></div>
        <div class="vstep" style="padding:10px 12px"><b class="small">Faithfulness check</b><div class="xsmall muted">each claim span scored vs its cited source span (NLI); "novel" content flagged for SME</div></div>
        <div class="vconn"></div>
        <div class="vstep" style="padding:10px 12px"><b class="small">Constraint enforcement</b><div class="xsmall muted">renderer drops/flags any node whose applicability constraints don't match target context</div></div>
      </div>
      <p class="xsmall" style="margin-top:10px">Output carries a per-section <span class="hl">grounded / unsupported</span> status so reviewers see exactly what to check.</p>
    </div>
  </div>

  <div class="grid g2" style="margin-top:16px;align-items:start">
    <div class="card"><h4>Why structured-object → deterministic render beats prose generation</h4>
      <p class="small">It bounds the error space. The model fills typed factors; layout, numbering, required headings &amp; workflow ordering are pre-tested code that <b>cannot hallucinate</b>. The result is reproducible, diffable, template-versionable, and renders to many formats from one source of truth ("compiled AI").</p></div>
    <div class="flag" style="margin-top:0"><div class="fi">📍</div><div><div class="ft">Decision flag · structured-output engine</div>
      <p>Recommend <b>Instructor</b> (Pydantic-native, provider-portable, auto-retry on validation) at the app layer, plus native structured outputs / tool-use on hosted models. <b>Anthropic Citations API</b> for character-level grounding. If self-hosting, grammar-constrained decoding via <b>Outlines / XGrammar</b>. Confirm citation approach.</p></div></div>
  </div>
  <div class="row wrap" style="gap:6px;margin-top:12px"><span class="tag">Pydantic v2</span><span class="tag b">Instructor</span><span class="tag b">Outlines / XGrammar</span><span class="tag p">Anthropic Citations</span><span class="tag">Mermaid → .vsdx</span><span class="tag">Jinja2 renderer</span></div>
 </div>
</section>

<!-- ░░░ SLIDE 13 — GENERATION PLATFORM / APP LAYER ░░░ -->
<section class="slide" data-title="Generation Platform & App Layer" data-sec="05 · Generation">
 <div class="slide-inner">
  <div class="chip purple"><span class="dot"></span>Stage 05 · Platform &amp; app layer</div>
  <h2 class="title">A production app layer: <span class="g">versioned prompts, swappable models, full audit</span></h2>
  <p class="sub">The generation logic runs behind a hardened service layer engineered for governance, reproducibility and model independence — so the platform survives model churn and every generation is auditable.</p>

  <div class="grid g4">

    <div class="card t"><div class="ico">💬</div><h4>Chat &amp; generation history</h4><p>Every generation stored: input object, <b>prompt version, model, citations, validation status, cost/latency</b> — for audit &amp; reproducibility.</p><div class="row wrap" style="gap:5px;margin-top:8px"><span class="tag">Postgres</span><span class="tag b">pgvector</span></div></div>

  </div>

  <!-- request flow -->
  <div class="card" style="margin-top:16px;border-color:var(--border2)">
    <h4>Request path</h4>
    <div class="flow" style="margin-top:10px">
      <div class="fstep"><div class="t" style="font-size:11px">FastAPI /generate</div></div><div class="farrow">➜</div>
      <div class="fstep"><div class="t" style="font-size:11px">Braintrust prompt (vN)</div></div><div class="farrow">➜</div>
      <div class="fstep"><div class="t" style="font-size:11px">LiteLLM gateway</div></div><div class="farrow">➜</div>

  <h2 class="title">Every quality criterion is <span class="g">measured, scored &amp; gated</span></h2>
  <p class="sub">We turn DOC-100949's four output-quality criteria into concrete, analytic scorers — criterion-by-criterion so regressions
   are root-causable — and add standard RAG metrics. Thresholds gate releases; SME-intervention triggers are explicit.</p>

  <!-- 4 spec criteria -->
  <table class="tb">
   <thead><tr><th style="width:22%">Spec criterion (§10.1)</th><th style="width:48%">How we measure it</th><th>Scorer type</th></tr></thead>
   <tbody>
    <tr><td><b>Technical correctness</b></td><td>Reference-grounded LLM-judge compares each claim vs retrieved context + golden FSD (1–5 rubric); <b>deterministic checks</b> for spec-mandated fields (units, interface names, tolerances)</td><td><span class="tag p">LLM-judge</span><span class="tag b">rule</span></td></tr>
    <tr><td><b>Logical completeness</b></td><td>Decompose golden FSD into an atomic requirement checklist; score = <b>precision + recall</b> over expected requirements/sections present &amp; non-contradictory</td><td><span class="tag p">coverage judge</span></td></tr>
    <tr><td><b>Consistency w/ historical designs</b></td><td>Retrieval-augmented judge pulls nearest historical FSDs via graph/vector and scores terminology / pattern / decision alignment; flags contradictions</td><td><span class="tag p">RAG judge</span></td></tr>
    <tr><td><b>Alignment w/ FSD standards</b></td><td>Mostly <b>deterministic</b> — schema/structure validators (required sections, numbering, template conformance) + LLM-judge for style/tone</td><td><span class="tag b">rule</span><span class="tag p">judge</span></td></tr>
   </tbody>
  </table>

  <div class="grid g2" style="margin-top:16px;align-items:start">
    <div class="col">
      <div class="card t">
        <h4>Standard RAG metrics added</h4>
        <div class="grid g2" style="gap:10px;margin-top:6px">
          <div class="stat" style="padding:12px"><div class="v" style="font-size:15px;color:#fff">Faithfulness / groundedness</div><div class="l">% output claims supported by retrieved context</div></div>
          <div class="stat" style="padding:12px"><div class="v" style="font-size:15px;color:#fff">Context precision / recall</div><div class="l">isolates retrieval vs generation failures</div></div>
          <div class="stat" style="padding:12px"><div class="v" style="font-size:15px;color:#fff">Answer relevance</div><div class="l">does the draft address DOO intent</div></div>
          <div class="stat" style="padding:12px"><div class="v" style="font-size:15px;color:#fff">Citation accuracy</div><div class="l">do inline citations point to the right source</div></div>
        </div>
        <div class="row wrap" style="gap:6px;margin-top:10px"><span class="tag p">Braintrust autoevals</span><span class="tag">RAGAS</span><span class="tag">DeepEval</span><span class="tag b">TruLens</span></div>
      </div>
    </div>
    <div class="col">
      <div class="card">
        <h4>Golden datasets from DOO → FSD pairs</h4>
        <p class="small">SME-labelled <b>DOO→FSD pairs</b> as ground truth. Each row: <span class="tag">DOO input</span><span class="tag">retrieved-context snapshot</span><span class="tag">reference FSD</span><span class="tag">requirement checklist</span><span class="tag">criterion scores</span></p>
        <p class="small" style="margin-top:8px">~<b>200–250 samples per slice</b> for 5% margin @95% confidence; start 50–100 high-value pairs &amp; grow. Frozen <b>regression set</b> + random production sampling for novel failures.</p>
      </div>
      <div class="card" style="background:linear-gradient(120deg,rgba(69,208,189,.08),rgba(44,132,200,.05))">
        <h4>Continuous eval &amp; gating</h4>
        <p class="small"><b>Offline</b> experiments on the golden set run in CI on every prompt/retrieval/model change; <b>online</b> scorers sample live traffic. Scorecards with pass/fail thresholds per criterion (e.g. <span class="hl">faithfulness ≥ 0.90</span>, <span class="hl">completeness ≥ 0.85</span>) — Braintrust computes significance vs baseline &amp; <b>blocks deploy on degradation</b>.</p>
      </div>
    </div>
  </div>

<!-- ░░░ SLIDE 15 — OBSERVABILITY ░░░ -->
<section class="slide" data-title="Observability" data-sec="06 · Observability">
 <div class="slide-inner">
  <div class="chip purple"><span class="dot"></span>Stage 06 · Observability</div>
  <h2 class="title">Every chunk, retrieval &amp; LLM call is <span class="g">traced end-to-end</span></h2>
  <p class="sub">One vendor-neutral trace per FSD generation captures the whole journey — ingestion, retrieval (with scores) and every model call
   (inputs, outputs, tokens, cost, latency). When a draft is wrong, we can tell instantly <i>where</i> it went wrong.</p>

  <div class="grid g2" style="grid-template-columns:1fr 1fr;align-items:start">
   <!-- trace tree -->

<!-- ░░░ SLIDE 16 — HUMAN FEEDBACK LOOP ░░░ -->
<section class="slide" data-title="Human Feedback Loop" data-sec="06 · Feedback">
 <div class="slide-inner">
  <div class="chip purple"><span class="dot"></span>Continuous backbone · Human feedback</div>
  <h2 class="title">SME feedback is <span class="g">captured, routed &amp; closed back into the system</span></h2>
  <p class="sub">Every draft FSD is a learning opportunity. We capture SME signals on each output, attach them to the originating trace,
   and turn them into the fuel that improves ingestion, retrieval and generation — reactively now, automatically at scale.</p>

  <!-- the loop -->
  <div class="card" style="padding:18px;border-color:var(--border2)">
    <div class="flow" style="align-items:stretch">
      <div class="fstep pinktop"><div class="e">✍️</div><div class="t">① Capture</div><div class="d">thumbs · ratings · inline edits (diff = correction) · comments — on every draft</div></div>
      <div class="farrow">➜</div>
      <div class="fstep purpletop"><div class="e">🔭</div><div class="t">② Route to observability</div><div class="d">feedback attached to the trace id; logged as span-level scores in Braintrust</div></div>
      <div class="farrow">➜</div>
      <div class="fstep cyantop"><div class="e">🗃️</div><div class="t">③ Turn into datasets</div><div class="d">corrected FSDs → golden refs · thumbs-down → regression tests · edit-diffs → failure patterns</div></div>
      <div class="farrow">➜</div>
      <div class="fstep tealtop"><div class="e">🛠️</div><div class="t">④ Diagnose &amp; fix</div><div class="d">is the fault in ingestion, retrieval, or generation? trace tells us where</div></div>
      <div class="farrow">↩</div>
      <div class="fstep" style="border-top:2px solid var(--green)"><div class="e">🔁</div><div class="t">⑤ Improve</div><div class="d">re-eval against golden set → confirm the fix, prevent regressions</div></div>
    </div>
  </div>

  <!-- tiered approach -->
  <div class="grid g3" style="margin-top:16px">
    <div class="card t"><div class="row center between"><h4 style="margin:0">Tier 1 — recommended first</h4><span class="badge auto">low-risk</span></div>
      <p style="margin-top:8px">Feedback-as-eval-data → tune <b>prompts &amp; retrieval</b> (rerank weights, chunking, filters). Fast, no training, where most gains live in a regulated doc domain.</p></div>
    <div class="card t"><div class="row center between"><h4 style="margin:0">Tier 2 — reactive</h4><span class="badge" style="color:var(--amber);background:rgba(245,185,74,.08)">SME-gated</span></div>
      <p style="margin-top:8px">SME-intervention thresholds queue low-scoring drafts for human review; corrections promoted straight into the golden/regression sets.</p></div>
    <div class="card t"><div class="row center between"><h4 style="margin:0">Tier 3 — automated</h4><span class="badge tool">at scale</span></div>
      <p style="margin-top:8px">Once enough consistent preference pairs accumulate, <b>DPO</b> (≈66% faster than RLHF, comparable win-rate) for targeted model alignment.</p></div>
  </div>

  <div class="flag"><div class="fi">📍</div><div><div class="ft">Decision flag · how far to close the loop</div>
   <p>We recommend starting at <b>Tier 1–2</b> (prompt/retrieval tuning + reactive SME review) and deferring <b>Tier 3 DPO/RLHF</b> until prompt/retrieval gains plateau — fine-tuning needs hundreds–thousands of consistent SME labels and risks regressing structured reasoning. Confirm appetite for model fine-tuning vs feedback-as-eval-data only.</p></div></div>
  <div class="row wrap" style="gap:6px;margin-top:12px"><span class="tag p">Braintrust human review</span><span class="tag">feedback-as-eval-data</span><span class="tag b">DPO</span><span class="tag b">RLHF</span></div>
 </div>
</section>

<script>
/* ===== build deck from <template> ===== */
const tpl = document.getElementById('slides');
const deck = document.getElementById('deck');
deck.append(...tpl.content.cloneNode(true).childNodes);
let slides = [...document.querySelectorAll('.slide')];
let i = 0;
const cur=document.getElementById('cur'), tot=document.getElementById('tot'), prog=document.getElementById('prog');

function render(){
  slides.forEach((s,idx)=>s.classList.toggle('active', idx===i));
  cur.textContent=i+1; tot.textContent=slides.length;
  prog.style.width=((i+1)/slides.length*100)+'%';
  const a=document.querySelector('.slide.active'); if(a) a.scrollTop=0;
}
function go(n){ i=Math.max(0,Math.min(slides.length-1,n)); render(); }
document.getElementById('next').onclick=()=>go(i+1);
document.getElementById('prev').onclick=()=>go(i-1);
document.getElementById('first').onclick=()=>go(0);
document.getElementById('last').onclick=()=>go(slides.length-1);
document.addEventListener('keydown',e=>{
  if(e.key==='ArrowRight'||e.key==='PageDown'){go(i+1)}
  else if(e.key==='ArrowLeft'||e.key==='PageUp'){go(i-1)}
  else if(e.key==='Home'){go(0)} else if(e.key==='End'){go(slides.length-1)}
  else if(e.key.toLowerCase()==='s'){toggleOv()}
  else if(e.key==='Escape'){document.getElementById('overlay').classList.remove('open')}
});
/* index overlay */
const overlay=document.getElementById('overlay'), idxGrid=document.getElementById('idxGrid');
function buildIdx(){
  idxGrid.innerHTML='';
  slides.forEach((s,idx)=>{
    const c=document.createElement('div');c.className='idxcard';
    c.innerHTML=`<div class="ci">${String(idx+1).padStart(2,'0')} · ${s.dataset.sec||''}</div><div class="ct">${s.dataset.title||'Slide'}</div>`;
    c.onclick=()=>{go(idx);toggleOv(false)};
    idxGrid.append(c);
  });
}
function toggleOv(force){ const open = force===undefined? !overlay.classList.contains('open'):force;
  overlay.classList.toggle('open',open); }
document.getElementById('menuBtn').onclick=()=>toggleOv();
document.getElementById('ovClose').onclick=()=>toggleOv(false);
buildIdx(); render();
</script>
