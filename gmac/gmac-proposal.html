<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GMAC × Velotio · AI Metadata Tagging — Proposal</title>
<style>
:root{
  --g:#27A27D; --g-d:#055143; --g-d2:#033a30; --g-l:#5cc0a1;
  --mint:#eef7f3; --mint2:#f6fbf9; --mintline:#d4ebe2;
  --ink:#0f2620; --muted:#5d716b; --line:#dfe8e4; --card:#ffffff;
  --gold:#d9a441; --coral:#e07856; --slate:#34433e;
  --shadow:0 4px 18px rgba(5,81,67,.08); --shadow-lg:0 18px 50px rgba(5,81,67,.18);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  color:var(--ink);background:#0c211b;-webkit-font-smoothing:antialiased}
/* deck shell */
.deck{position:relative;height:100vh;overflow:hidden}
.slide{position:absolute;inset:0;display:none;flex-direction:column;background:var(--mint2);
  padding:46px 64px 78px;overflow:auto;animation:in .45s cubic-bezier(.2,.7,.2,1)}
.slide.active{display:flex}
@keyframes in{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.slide.dark{background:radial-gradient(120% 120% at 80% -10%,#0c6b56 0%,var(--g-d) 45%,var(--g-d2) 100%);color:#eafff8}
.kicker{font-size:12px;font-weight:800;letter-spacing:2.4px;text-transform:uppercase;color:var(--g);margin-bottom:14px;
  display:flex;align-items:center;gap:10px}
.kicker::before{content:"";width:26px;height:2px;background:var(--g)}
.dark .kicker{color:var(--g-l)} .dark .kicker::before{background:var(--g-l)}
h1{font-size:46px;line-height:1.08;margin:0 0 18px;font-weight:800;letter-spacing:-.5px}
h2.sh{font-size:32px;line-height:1.12;margin:0 0 8px;font-weight:800;letter-spacing:-.4px}
.lead{font-size:18px;line-height:1.5;color:var(--muted);max-width:820px;margin:0 0 8px}
.dark .lead{color:#bfe9dc}
.fill{flex:1}
/* chrome: progress + nav */
.topbar{position:fixed;top:0;left:0;right:0;height:5px;background:rgba(5,81,67,.12);z-index:60}
.topbar .fillbar{height:100%;background:linear-gradient(90deg,var(--g),var(--g-l));transition:width .4s}
.brandmark{position:fixed;top:20px;right:30px;z-index:61;display:flex;align-items:center;gap:9px;font-weight:800;
  letter-spacing:.5px;color:var(--g-d);font-size:15px}
.dark .brandmark{color:#eafff8}
.brandmark .gm{font-size:21px;font-weight:800;color:var(--g);letter-spacing:-1px}
.brandmark .x{opacity:.5;font-weight:500}
.nav{position:fixed;bottom:18px;left:0;right:0;z-index:61;display:flex;align-items:center;justify-content:center;gap:16px}
.nav button{border:none;background:var(--g-d);color:#fff;width:40px;height:40px;border-radius:50%;font-size:17px;cursor:pointer;
  box-shadow:var(--shadow);transition:.15s;display:flex;align-items:center;justify-content:center}
.nav button:hover{background:var(--g)} .nav button:disabled{opacity:.3;cursor:default}
.dots{display:flex;gap:7px;align-items:center}
.dots i{width:8px;height:8px;border-radius:50%;background:rgba(5,81,67,.22);cursor:pointer;transition:.2s}
.dots i.on{background:var(--g);width:22px;border-radius:5px}
.counter{position:fixed;bottom:24px;right:30px;z-index:61;font-size:12px;color:var(--muted);font-weight:700}
.hint{position:fixed;bottom:24px;left:30px;z-index:61;font-size:11px;color:var(--muted)}
/* building blocks */
.grid{display:grid;gap:18px}
.c2{grid-template-columns:1fr 1fr}.c3{grid-template-columns:repeat(3,1fr)}.c4{grid-template-columns:repeat(4,1fr)}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:22px}
.dark .card{background:rgba(255,255,255,.07);border-color:rgba(255,255,255,.14);box-shadow:none;backdrop-filter:blur(4px)}
.pill{display:inline-flex;align-items:center;gap:6px;padding:5px 12px;border-radius:30px;font-size:12px;font-weight:800;
  background:var(--mint);color:var(--g-d);border:1px solid var(--mintline)}
.dark .pill{background:rgba(255,255,255,.12);color:#eafff8;border-color:rgba(255,255,255,.2)}
.big-num{font-size:44px;font-weight:800;color:var(--g-d);line-height:1;letter-spacing:-1px}
.dark .big-num{color:#fff}
.label{font-size:12px;text-transform:uppercase;letter-spacing:.8px;color:var(--muted);font-weight:800;margin-top:7px}
.dark .label{color:#9fd3c4}
.icon{width:46px;height:46px;border-radius:13px;background:var(--mint);color:var(--g-d);display:flex;align-items:center;
  justify-content:center;font-size:22px;font-weight:800;margin-bottom:14px;border:1px solid var(--mintline)}
.card h3{margin:0 0 7px;font-size:18px}
.card p{margin:0;color:var(--muted);font-size:14px;line-height:1.55}
ul.clean{margin:8px 0 0;padding-left:0;list-style:none}
ul.clean li{position:relative;padding-left:24px;margin:9px 0;color:var(--slate);font-size:14.5px;line-height:1.5}
ul.clean li::before{content:"";position:absolute;left:2px;top:8px;width:8px;height:8px;border-radius:2px;background:var(--g)}
.dark ul.clean li{color:#cdeee4}
.tag-chip{font-family:ui-monospace,Menlo,monospace;font-size:12px;background:var(--mint);color:var(--g-d);
  padding:2px 8px;border-radius:6px;border:1px solid var(--mintline)}
.emph{color:var(--g-d);font-weight:700}
.dark .emph{color:#8fe6cd}
/* principle index numbers */
.pidx{font-size:13px;font-weight:800;color:var(--g);letter-spacing:1px}
/* flow chain */
.flow{display:flex;align-items:stretch;gap:0;flex-wrap:wrap}
.flow .node{flex:1;min-width:120px;background:var(--card);border:1px solid var(--line);border-radius:13px;padding:14px;text-align:center;box-shadow:var(--shadow)}
.flow .node .t{font-weight:800;font-size:13.5px;color:var(--g-d)}
.flow .node .d{font-size:11.5px;color:var(--muted);margin-top:4px}
.flow .arr{display:flex;align-items:center;color:var(--g-l);font-size:20px;padding:0 6px}
/* screenshot frame */
.shot{border-radius:12px;overflow:hidden;box-shadow:var(--shadow-lg);border:1px solid var(--line);background:#fff}
.shot .bar{background:#e9efec;display:flex;align-items:center;gap:7px;padding:9px 13px;border-bottom:1px solid var(--line)}
.shot .bar i{width:11px;height:11px;border-radius:50%}
.shot .bar .u{margin-left:12px;background:#fff;border:1px solid var(--line);border-radius:7px;padding:3px 12px;font-size:11px;
  color:var(--muted);flex:1;max-width:420px}
.shot .body{background:#f4f7f6}
.cap{font-size:12.5px;color:var(--muted);margin-top:10px;display:flex;align-items:center;gap:8px}
.cap b{color:var(--g-d)}
/* mini-ui (reused prototype components, compact) */
.ui{font-size:12px;color:#16302a}
.ui .hd{background:linear-gradient(120deg,var(--g-d),#0c6b56);color:#fff;padding:9px 14px;display:flex;align-items:center;gap:9px;font-weight:700;font-size:12.5px}
.ui .hd .lg{width:22px;height:22px;border-radius:6px;background:var(--g);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:11px}
.ui .tabs{display:flex;gap:2px;background:var(--g-d);padding:0 12px}
.ui .tabs span{color:#bfe9dc;font-size:11px;font-weight:700;padding:8px 11px;border-bottom:2px solid transparent}
.ui .tabs span.on{color:#fff;border-color:var(--g-l)}
.ui .pane{padding:14px}
.ui .row2{display:grid;grid-template-columns:150px 1fr;gap:12px}
.ilist .it{padding:8px 9px;border-radius:7px;margin-bottom:4px;border:1px solid transparent}
.ilist .it.sel{background:#e7f4ee;border-color:#bfe3d3}
.ilist .it .id{font-weight:800;font-size:11px;color:var(--g-d)}
.ilist .it .s{color:var(--muted);font-size:10.5px;margin-top:2px;line-height:1.3}
.chip{display:inline-block;padding:1px 7px;border-radius:20px;font-size:9.5px;font-weight:800}
.chip.q{background:#e6f6f1;color:var(--g-d)}.chip.v{background:#efeaff;color:#6d5dd3}.chip.d{background:#fdf1e3;color:#b9772a}
.chip.ok{background:#e7f6ee;color:#1aa251}.chip.ai{background:#eef2f3;color:#5d716b}.chip.ed{background:#fdf1e3;color:#b9772a}
.detail .stem{background:#f6faf8;border-left:3px solid var(--g);border-radius:7px;padding:9px 11px;font-size:11.5px;margin-bottom:10px}
.cat{font-size:9.5px;text-transform:uppercase;letter-spacing:.6px;color:var(--g-d);font-weight:800;border-bottom:1px solid var(--line);padding-bottom:4px;margin:10px 0 7px}
.tg{display:grid;grid-template-columns:96px 1fr 56px;gap:8px;align-items:center;padding:4px 2px;font-size:11px}
.tg .lb{color:var(--muted);font-weight:600}
.tg .vl{font-weight:700}
.tg .cd{font-family:ui-monospace,Menlo,monospace;font-size:9.5px;background:#eef2f3;padding:0 5px;border-radius:4px;color:#5d716b}
.tg select{font-size:10.5px;border:1px solid var(--g);border-radius:6px;padding:2px 4px;background:#f3fbf8;color:var(--g-d);font-weight:700}
.cbar{height:5px;border-radius:3px;background:#e6ebe9;overflow:hidden}.cbar i{display:block;height:100%}
.acts{display:flex;gap:7px;margin-top:11px;border-top:1px solid var(--line);padding-top:10px}
.bt{border:none;border-radius:7px;padding:6px 11px;font-size:10.5px;font-weight:800;cursor:default}
.bt.p{background:var(--g);color:#fff}.bt.g{background:#eef2f3;color:#41506a}.bt.r{background:#fbe9e8;color:#d9534f}.bt.k{background:var(--g-d);color:#fff;margin-left:auto}
.qti{background:#08231d;color:#bfe9dc;border-radius:9px;padding:12px;font-family:ui-monospace,Menlo,monospace;font-size:10.5px;line-height:1.6;white-space:pre;overflow:auto}
.qti .t{color:#7fd6c2}.qti .a{color:#e0a23b}.qti .v{color:#9ec5fe}
.gate{padding:11px 15px;border-radius:10px;font-weight:800;display:flex;align-items:center;gap:11px;background:#e7f6ee;color:#0f7a3d;border:1px solid #b8e6cb;font-size:12px;margin-bottom:12px}
.gate .b{font-size:22px}
.fb{display:grid;grid-template-columns:120px 1fr 42px;gap:10px;align-items:center;padding:5px 2px;font-size:11px}
.fb .bar{height:7px;border-radius:4px;background:#e6ebe9;overflow:hidden}.fb .bar i{display:block;height:100%}
.fb .n{text-align:right;font-weight:800;font-size:11px}
table.cm{width:100%;border-collapse:collapse;font-size:10.5px}
table.cm th{background:#eef4f1;text-align:left;padding:5px 8px;font-size:9px;text-transform:uppercase;letter-spacing:.4px;color:var(--muted)}
table.cm td{padding:5px 8px;border-bottom:1px solid var(--line)}table.cm td.bad{color:#d9534f;font-weight:800}table.cm td.ok{color:#1aa251;font-weight:800}
.statmini{display:flex;gap:10px;margin-bottom:12px}
.statmini .s{flex:1;background:#fff;border:1px solid var(--line);border-radius:9px;padding:8px 11px}
.statmini .s .k{font-size:8.5px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);font-weight:800}
.statmini .s .v{font-size:18px;font-weight:800;color:var(--g-d)}
.ui .why{font-size:9.5px;color:#7d8d88;font-style:italic;margin:-1px 0 5px;padding-left:104px;line-height:1.35}
.ui .tbar{display:flex;gap:6px;margin-bottom:9px;align-items:center}
.ui .tbar input,.ui .tbar select{font-size:10px;border:1px solid var(--line);border-radius:6px;padding:4px 7px;background:#fff;color:#5d716b}
.ui .tbar input{flex:1}
.ui .tbar select.on{border-color:var(--g);color:var(--g-d);font-weight:800;background:#f3fbf8}
.chip.fl{background:#fbe9e8;color:#d9534f}
.ilist .it .mt{display:flex;gap:5px;margin-top:6px;align-items:center}
.ilist .it .mt .pc{margin-left:auto;font-size:9.5px;color:#5d716b;font-weight:700}
.editflag{display:inline-flex;align-items:center;gap:5px;background:#fff7ea;border:1px solid #f0dcb4;color:#9a6b16;
  font-size:10px;font-weight:700;border-radius:7px;padding:5px 9px;margin-top:9px}
/* timeline */
.tl{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;position:relative}
.tl .ph{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:18px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.tl .ph::before{content:"";position:absolute;top:0;left:0;right:0;height:5px;background:var(--g)}
.tl .ph:nth-child(2)::before{background:var(--g-l)}.tl .ph:nth-child(3)::before{background:var(--gold)}.tl .ph:nth-child(4)::before{background:var(--coral)}
.tl .wk{font-size:11px;font-weight:800;letter-spacing:.5px;color:var(--g);text-transform:uppercase}
.tl .drop{font-size:10px;font-weight:800;color:#fff;background:var(--g-d);border-radius:20px;padding:2px 9px;display:inline-block;margin:8px 0}
.tl .ph:nth-child(3) .drop{background:var(--gold)}.tl .ph:nth-child(4) .drop{background:var(--coral)}
.tl h4{margin:4px 0 8px;font-size:15px}
.tl ul{margin:0;padding-left:0;list-style:none}
.tl li{font-size:12px;color:var(--slate);margin:6px 0;padding-left:16px;position:relative;line-height:1.4}
.tl li::before{content:"→";position:absolute;left:0;color:var(--g);font-weight:800}
.tl .val{margin-top:10px;font-size:11.5px;background:var(--mint);border-radius:8px;padding:7px 9px;color:var(--g-d);font-weight:600;border:1px solid var(--mintline)}
.seq{display:flex;align-items:stretch;gap:0;flex-wrap:wrap}
.sq{flex:1;min-width:150px;display:flex;gap:11px;background:var(--card);border:1px solid var(--line);border-radius:14px;
  padding:15px 14px;box-shadow:var(--shadow);position:relative}
.sq .sqn{font-size:14px;font-weight:800;color:#fff;background:var(--g);width:28px;height:28px;border-radius:8px;
  display:flex;align-items:center;justify-content:center;flex:0 0 28px}
.sq:nth-child(5) .sqn{background:var(--g-l)}.sq:nth-child(7) .sqn{background:var(--gold)}.sq:nth-child(9) .sqn{background:var(--coral)}
.sqc h4{margin:0 0 4px;font-size:14.5px;line-height:1.15}
.sqc p{margin:0;font-size:12px;color:var(--muted);line-height:1.45}
.sqa{display:flex;align-items:center;color:var(--g-l);font-size:22px;font-weight:800;padding:0 4px}
.platband{margin-top:18px;background:linear-gradient(120deg,var(--g-d),#0c6b56);color:#eafff8;border-radius:14px;
  padding:18px 22px;display:flex;align-items:center;gap:16px;font-size:14.5px;line-height:1.5}
.platband .pl{font-size:30px;flex:0 0 auto;color:#8fe6cd}
.platband .emph{color:#8fe6cd;font-weight:800}
.ribbon{background:var(--g-d);color:#fff;border-radius:12px;padding:14px 20px;display:flex;align-items:center;gap:14px;font-weight:600;margin-top:18px}
.ribbon .tag{background:var(--g);padding:5px 13px;border-radius:30px;font-weight:800;font-size:13px}
/* arch svg wrap */
.archwrap{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px;box-shadow:var(--shadow);overflow:auto}
.legend{display:flex;gap:18px;flex-wrap:wrap;margin-top:12px;font-size:12px;color:var(--muted)}
.legend span{display:flex;align-items:center;gap:7px}.legend i{width:11px;height:11px;border-radius:3px}
@media(max-width:980px){.slide{padding:36px 26px 78px}h1{font-size:34px}h2.sh{font-size:26px}.c3,.c4,.tl{grid-template-columns:1fr 1fr}.c2{grid-template-columns:1fr}}
</style>
</head>

<script id="app">
const deck=document.getElementById('deck');
deck.innerHTML=SLIDES.join('');
const slides=[...deck.querySelectorAll('.slide')];
const dotsEl=document.getElementById('dots');
slides.forEach((_,i)=>{const d=document.createElement('i');if(i===0)d.className='on';d.onclick=()=>go(i);dotsEl.appendChild(d);});
const dots=[...dotsEl.children];
let cur=0;
function go(n){
  cur=Math.max(0,Math.min(slides.length-1,n));
  slides.forEach((s,i)=>s.classList.toggle('active',i===cur));
  dots.forEach((d,i)=>d.classList.toggle('on',i===cur));
  document.getElementById('fillbar').style.width=((cur+1)/slides.length*100)+'%';
  document.getElementById('counter').textContent=(cur+1)+' / '+slides.length;
  document.getElementById('prev').disabled=cur===0;
  document.getElementById('next').disabled=cur===slides.length-1;
  deck.scrollTop=0; slides[cur].scrollTop=0;
}
document.getElementById('prev').onclick=()=>go(cur-1);
document.getElementById('next').onclick=()=>go(cur+1);
document.addEventListener('keydown',e=>{
  if(e.key==='ArrowRight'||e.key==='PageDown'||e.key===' '){e.preventDefault();go(cur+1);}
  if(e.key==='ArrowLeft'||e.key==='PageUp'){e.preventDefault();go(cur-1);}
  if(e.key==='Home')go(0); if(e.key==='End')go(slides.length-1);
});
go(0);
</script>
