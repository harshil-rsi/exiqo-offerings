<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GMAC · AI Metadata Tagging Platform (Prototype)</title>
<style>
:root{
  --navy:#0b2545; --navy2:#13315c; --teal:#0fa3b1; --teal-d:#0c8390;
  --bg:#f4f6f9; --card:#ffffff; --ink:#1b2330; --muted:#64748b; --line:#e2e8f0;
  --green:#1aa251; --amber:#e8a33d; --red:#d9534f; --violet:#6d5dd3;
  --chip:#eef2f7; --shadow:0 1px 3px rgba(16,24,40,.08),0 1px 2px rgba(16,24,40,.06);
  --radius:12px;
}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  background:var(--bg);color:var(--ink);font-size:14px;line-height:1.5}
header.topbar{background:linear-gradient(120deg,var(--navy),var(--navy2));color:#fff;padding:14px 26px;
  display:flex;align-items:center;gap:16px;position:sticky;top:0;z-index:50;box-shadow:0 2px 10px rgba(0,0,0,.12)}
.logo{width:40px;height:40px;border-radius:9px;background:var(--teal);display:flex;align-items:center;justify-content:center;
  font-weight:800;font-size:18px;letter-spacing:.5px}
.brand h1{font-size:16px;margin:0;font-weight:700}
.brand p{margin:0;font-size:11.5px;color:#aebfd6}
.badge-proto{margin-left:auto;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.25);
  padding:5px 11px;border-radius:20px;font-size:11px;letter-spacing:.4px}
nav.tabs{background:var(--navy);display:flex;gap:2px;padding:0 18px;position:sticky;top:68px;z-index:49;
  box-shadow:var(--shadow);overflow-x:auto}
nav.tabs button{background:transparent;border:none;color:#9fb3d1;padding:13px 18px;font-size:13.5px;font-weight:600;
  cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap;transition:.15s}
nav.tabs button:hover{color:#fff}
nav.tabs button.active{color:#fff;border-bottom-color:var(--teal)}
main{max-width:1240px;margin:0 auto;padding:26px 22px 70px}
.view{display:none;animation:fade .25s ease}
.view.active{display:block}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
h2.section-title{font-size:20px;margin:0 0 4px}
.sub{color:var(--muted);margin:0 0 20px;max-width:760px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.grid{display:grid;gap:16px}
.stat-row{grid-template-columns:repeat(4,1fr);margin-bottom:20px}
.stat{padding:16px 18px}
.stat .k{font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);font-weight:700}
.stat .v{font-size:26px;font-weight:800;margin-top:4px;color:var(--navy)}
.stat .v small{font-size:13px;color:var(--muted);font-weight:600}
.pill{display:inline-block;padding:2px 9px;border-radius:20px;font-size:11px;font-weight:700;letter-spacing:.3px}
.pill.q{background:#e6f6f8;color:var(--teal-d)} .pill.v{background:#efeaff;color:var(--violet)}
.pill.d{background:#fdf1e3;color:#b9772a}
.pill.ai{background:#eef2f7;color:#52617a} .pill.edited{background:#fdf1e3;color:#b9772a}
.pill.approved{background:#e7f6ee;color:var(--green)} .pill.flagged{background:#fbe9e8;color:var(--red)}
/* tag review layout */
.review-wrap{display:grid;grid-template-columns:340px 1fr;gap:16px;align-items:start}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;align-items:center}
.toolbar input,.toolbar select{padding:8px 10px;border:1px solid var(--line);border-radius:8px;font-size:13px;background:#fff}
.toolbar input[type=search]{flex:1;min-width:160px}
.itemlist{max-height:660px;overflow:auto;padding:6px}
.itemrow{padding:11px 12px;border-radius:9px;cursor:pointer;border:1px solid transparent;margin-bottom:4px}
.itemrow:hover{background:#f7f9fc}
.itemrow.sel{background:#eef5ff;border-color:#c7ddff}
.itemrow .id{font-weight:700;font-size:12.5px}
.itemrow .stem{color:var(--muted);font-size:12px;margin-top:2px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.itemrow .meta{display:flex;gap:6px;margin-top:7px;align-items:center;flex-wrap:wrap}
.detail{padding:20px 22px;min-height:660px}
.detail .qid{font-size:12px;color:var(--muted);font-weight:700;letter-spacing:.4px}
.stem-box{background:#f8fafc;border:1px solid var(--line);border-left:3px solid var(--teal);border-radius:8px;
  padding:13px 15px;margin:10px 0 6px;font-size:13.5px;white-space:pre-wrap}
.opts{font-size:12.5px;color:#41506a;margin:2px 0 18px;padding-left:2px}
.catblock{margin-bottom:16px}
.catblock h4{font-size:12px;text-transform:uppercase;letter-spacing:.7px;color:var(--navy);margin:0 0 9px;
  padding-bottom:6px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px}
.catblock h4 .ic{width:7px;height:7px;border-radius:2px;background:var(--teal)}
.tag{display:grid;grid-template-columns:150px 1fr 120px;gap:10px;align-items:center;padding:8px 6px;border-radius:7px}
.tag:hover{background:#f7f9fc}
.tag .label{font-size:12px;color:var(--muted);font-weight:600}
.tag .valwrap{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.tagval{font-weight:600;font-size:13px}
.code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11px;background:var(--chip);
  padding:1px 6px;border-radius:5px;color:#52617a}
.tag select{padding:5px 7px;border:1px solid var(--line);border-radius:7px;font-size:12.5px;max-width:100%;background:#fff}
.conf{display:flex;align-items:center;gap:7px;justify-content:flex-end}
.confbar{width:54px;height:7px;border-radius:4px;background:#eceff3;overflow:hidden}
.confbar i{display:block;height:100%;border-radius:4px}
.conf small{font-size:11px;font-weight:700;width:30px;text-align:right}
.why{font-size:11.5px;color:var(--muted);grid-column:2/4;margin:-2px 0 2px;padding-left:2px;font-style:italic}
.narr{background:#f3f7ff;border:1px solid #dbe7fb;border-radius:8px;padding:11px 13px;font-size:12.5px;color:#34465f}
.actionsbar{display:flex;gap:10px;margin-top:18px;padding-top:16px;border-top:1px solid var(--line);flex-wrap:wrap}
button.btn{border:none;border-radius:8px;padding:9px 16px;font-size:13px;font-weight:700;cursor:pointer}
.btn.primary{background:var(--teal);color:#fff} .btn.primary:hover{background:var(--teal-d)}
.btn.ghost{background:#eef2f7;color:#41506a} .btn.ghost:hover{background:#e2e8f0}
.btn.danger{background:#fbe9e8;color:var(--red)} .btn.danger:hover{background:#f7d7d5}
.btn.dark{background:var(--navy);color:#fff} .btn.dark:hover{background:var(--navy2)}
.qti-pre{background:#0d1b2a;color:#cfe3f5;border-radius:9px;padding:14px 16px;font-family:ui-monospace,Menlo,monospace;
  font-size:11.5px;overflow:auto;line-height:1.55;white-space:pre}
.qti-pre .t{color:#7fd6c2}.qti-pre .a{color:#e6b96b}.qti-pre .v{color:#9ec5fe}
/* evals */
.eval-grid{grid-template-columns:repeat(4,1fr)}
.uploadbox{border:2px dashed #cdd8e6;border-radius:12px;padding:26px;text-align:center;background:#fbfcfe;margin-bottom:18px}
.uploadbox h3{margin:6px 0 4px;font-size:15px}
.fieldbar{display:grid;grid-template-columns:200px 1fr 70px;gap:12px;align-items:center;padding:9px 4px;border-bottom:1px solid var(--line)}
.fieldbar:last-child{border:none}
.bar{height:9px;border-radius:5px;background:#eceff3;overflow:hidden}
.bar i{display:block;height:100%;border-radius:5px}
.acc-num{font-weight:800;text-align:right;font-size:13px}
table.cm{width:100%;border-collapse:collapse;font-size:12.5px}
table.cm th,table.cm td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left}
table.cm th{background:#f6f8fb;font-size:11px;text-transform:uppercase;letter-spacing:.4px;color:var(--muted)}
table.cm td.bad{color:var(--red);font-weight:700}
table.cm td.ok{color:var(--green);font-weight:700}
.gate{padding:14px 18px;border-radius:10px;font-weight:700;display:flex;align-items:center;gap:12px;margin-bottom:18px}
.gate.pass{background:#e7f6ee;color:#0f7a3d;border:1px solid #b8e6cb}
.gate.fail{background:#fbe9e8;color:#a3322e;border:1px solid #f0c9c6}
.gate .big{font-size:24px}
/* overview / arch */
.col2{grid-template-columns:1fr 1fr}
.col3{grid-template-columns:repeat(3,1fr)}
.feat{padding:18px}
.feat .n{width:34px;height:34px;border-radius:9px;background:#e6f6f8;color:var(--teal-d);display:flex;align-items:center;
  justify-content:center;font-weight:800;margin-bottom:10px}
.feat h3{margin:0 0 6px;font-size:14.5px}
.feat p{margin:0;color:var(--muted);font-size:12.5px}
.phase{display:flex;gap:14px;padding:14px 0;border-bottom:1px solid var(--line)}
.phase:last-child{border:none}
.phase .ph{flex:0 0 92px;font-weight:800;color:var(--teal-d);font-size:12.5px}
.phase .pc h4{margin:0 0 3px;font-size:13.5px}
.phase .pc p{margin:0;color:var(--muted);font-size:12.5px}
ul.clean{margin:6px 0;padding-left:18px;color:#41506a}
ul.clean li{margin:4px 0}
.legend{display:flex;gap:18px;flex-wrap:wrap;margin-top:14px;font-size:12px;color:var(--muted)}
.legend span{display:flex;align-items:center;gap:6px}
.dot{width:11px;height:11px;border-radius:3px;display:inline-block}
.note{font-size:11.5px;color:var(--muted);margin-top:8px}
.kv{display:flex;gap:8px;font-size:12.5px;margin:5px 0}.kv b{flex:0 0 130px;color:var(--navy)}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;
  padding:11px 20px;border-radius:10px;font-size:13px;font-weight:600;box-shadow:0 6px 20px rgba(0,0,0,.25);
  opacity:0;pointer-events:none;transition:.25s;z-index:99}
.toast.show{opacity:1;transform:translateX(-50%) translateY(-4px)}
/* codebook tab */
.layerband{border-left:4px solid var(--teal);padding:14px 18px;margin-bottom:14px;background:#fff;border-radius:0 12px 12px 0}
.layerband.def{border-color:var(--violet)} .layerband.cross{border-color:var(--teal)} .layerband.annex{border-color:var(--amber)}
.layerband .tag2{font-size:11px;font-weight:800;letter-spacing:.6px;text-transform:uppercase}
.layerband.def .tag2{color:var(--violet)} .layerband.cross .tag2{color:var(--teal-d)} .layerband.annex .tag2{color:#b9772a}
.layerband h3{margin:4px 0 6px;font-size:15px} .layerband p{margin:0 0 8px;color:#41506a;font-size:13px}
.sheetchips{display:flex;gap:7px;flex-wrap:wrap}
.sheetchip{background:var(--chip);border-radius:7px;padding:5px 10px;font-size:11.5px;font-weight:600;color:#41506a}
.sheetchip b{color:var(--navy)} .sheetchip small{color:var(--muted);font-weight:500}
table.sheets{width:100%;border-collapse:collapse;font-size:12.5px}
table.sheets th,table.sheets td{padding:9px 11px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
table.sheets th{background:#f6f8fb;font-size:11px;text-transform:uppercase;letter-spacing:.4px;color:var(--muted);position:sticky;top:0}
table.sheets td.r{white-space:nowrap;font-weight:700;color:var(--navy)}
.grammar{display:flex;gap:8px;flex-wrap:wrap;align-items:stretch;margin:6px 0}
.gcell{flex:1;min-width:96px;border:1px solid var(--line);border-radius:9px;padding:9px 11px;background:#fff;text-align:center}
.gcell .gc{font-family:ui-monospace,Menlo,monospace;font-size:11px;color:var(--teal-d);font-weight:700}
.gcell .gn{font-size:11px;color:var(--muted);margin-top:3px}
.gcell.out{background:#f3f7ff;border-color:#dbe7fb}
.chain{display:flex;flex-direction:column;gap:0}
.cstep{display:grid;grid-template-columns:160px 1fr;gap:14px;align-items:center;padding:11px 0}
.cstep .src{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.4px;color:var(--navy);text-align:right}
.cstep .src small{display:block;color:var(--muted);font-weight:600;font-size:10.5px;text-transform:none;letter-spacing:0}
.cstep .body{background:#fff;border:1px solid var(--line);border-radius:9px;padding:10px 13px;font-size:12.5px}
.cstep .body .vv{font-weight:700;color:var(--ink)}
.carrow{height:16px;display:flex;align-items:center;padding-left:172px;color:#b6c2d4}
@media(max-width:900px){.review-wrap{grid-template-columns:1fr}.stat-row,.eval-grid{grid-template-columns:repeat(2,1fr)}.col2,.col3{grid-template-columns:1fr}.cstep{grid-template-columns:1fr}.cstep .src{text-align:left}.carrow{padding-left:0}}
</style>
</head>
<body>
<header class="topbar">
  <div class="logo">G</div>
  <div class="brand">
    <h1>GMAC · AI Metadata Tagging Platform</h1>
    <p>Bulk item-bank tagging · grounded in the GMAC skills codebook · human-in-the-loop review &amp; evals</p>
  </div>
  <div class="badge-proto">PROTOTYPE · Velotio</div>
</header>
<nav class="tabs" id="tabs">
  <button data-v="overview" class="active">Overview &amp; Plan</button>
  <button data-v="codebook">Codebook Map</button>
  <button data-v="review">Tag Review &amp; Edit</button>
  <button data-v="evals">Evaluation &amp; Accuracy</button>
  <button data-v="arch">Architecture</button>
</nav>
<main>
  <section class="view active" id="overview"></section>
  <section class="view" id="codebook"></section>
  <section class="view" id="review"></section>
  <section class="view" id="evals"></section>
  <section class="view" id="arch"></section>
</main>
<div class="toast" id="toast"></div>
<script id="appdata">
/* ============== TAXONOMY (subset of GMAC codebook from SkillSet Mapping Excel) ============== */
const WEF = ["Critical Thinking & Problem Solving","Data Literacy & Analytical Reasoning",
 "Communication & Comprehension","Decision-Making Under Uncertainty","Systems Thinking",
 "Cognitive Flexibility & Adaptability","Attention to Detail & Accuracy","Time & Cognitive Load Management",
 "Ethical & Evidence-Based Reasoning","Digital & Information Literacy"];

const VOCAB = {
  section:["Quant","Verbal","Data Insights"],
  itemType:["Problem Solving (A)","Data Sufficiency (DS)","Reading Comprehension (RC)",
            "Critical Reasoning (CRR)","Two-Part Analysis (BV)","Graphical Interpretation (PM)",
            "Table Analysis (MD)","Multi-Source Reasoning (A/MD)"],
  cont1:{ARI:"Arithmetic",ALG:"Algebra",GEO:"Geometry",CRR:"Critical Reasoning",
         RCS:"RC – Short",RCL:"RC – Long",GRI:"Graph (Math)",TAI:"Table (Math)",
         PAI:"Two-Part (Math)",MD:"Multi-Source"},
  cognitive:{PUR:"Pure (abstract maths)",REA:"Real (real-world context)",
         "MAI":"RC / Main Idea","INF":"RC / Inference","SUI":"RC / Supporting Idea","TON":"RC / Tone",
         "CST-CCN":"CR / Construction – Conclusion","CST-ASS":"CR / Construction – Assumption",
         "CTQ-WKN":"CR / Critique – Weaken","CTQ-STR":"CR / Critique – Strengthen",
         "PLA-PLA":"CR / Plan – Next steps","INM":"DI / Inference using math","APX":"DI / Application not using math"},
  fundSkill:{QRR:"Quant Reasoning – Rates/Ratios",QVO:"Quant – Values & Operations",
         QEU:"Quant – Equations",QCS:"Quant – Counting/Stats","–":"n/a"},
  elmType:{I:"Single-skill (I)",II:"Composite (II)",ID:"Integrated data (ID)"},
  cont2:{FDP:"Conversion – Frac/Dec/Pct",APP:"Applied (rate/interest/work)",PCT:"Percentages",
         "R&P":"Ratio & Proportion","P&S":"Probability & Statistics",LE1:"Linear Equation",
         QEI:"Quadratic Equation","CMP":"Computation",BUS:"Business scenario",SCI:"Science passage",
         "T":"Table","G":"Graph","P":"Prose/text"},
  cont3:{RAT:"Rate",IST:"Interest/Sales tax","P&L":"Profit & Loss",WRK:"Work","–":"—",
         AVG:"Mean",MED:"Median",DEC:"Decimals",FRA:"Fractions"},
  badging:["Arithmetic Fluency","Algebra Fluency","Contextual Modeling & Decision-Oriented Problem Solving",
           "Probabilistic Reasoning & Data Literacy","Reading Comprehension & Inference",
           "Critical Reasoning & Argument Evaluation","Data Sufficiency Judgment",
           "Data Interpretation & Insight","Multi-Source Synthesis"]
};

/* ============== SAMPLE ITEMS with simulated AI tags (grounded in CBN crosswalks) ============== */
/* each tag: [label, value, code, confidence(0-1), rationale]  ; status default 'ai' */
const ITEMS = [
 {id:"Q-10421",section:"Quant",sec:"q",
  stem:"If 3/8 of a number is 0.45, what is 150% of that same number?",
  opts:"(A) 0.90  (B) 1.20  (C) 1.575  (D) 1.80  (E) 2.40",
  tags:{
   "Structural":[["Section","Quant","",0.99,"Numeric, formula-driven single-answer item with 5 options → Quant."],
     ["Item Type","Problem Solving (A)","A",0.98,"Five-option single-select problem → item type A (PS)."],
     ["Element Type","Single-skill (I)","I",0.93,"Tests one core competency → Element type I."]],
   "Content Classification":[["Content Domain","Arithmetic","ARI",0.97,"Operates on number values & conversions, no variables/equations to solve → Arithmetic."],
     ["Subtopic","Conversion – Frac/Dec/Pct","FDP",0.95,"Requires moving between 3/8, 0.45 and 150% → FDP."],
     ["Sub-subtopic","—","–",0.90,"No further Cont3 split applies for FDP."]],
   "Cognitive Classification":[["Cognitive","Pure (abstract maths)","PUR",0.94,"Abstract numeric manipulation with no real-world scenario → PUR."],
     ["Fundamental Skill","Quant Reasoning – Rates/Ratios","QRR",0.88,"Maps to QRR cluster in CBN-QR for FDP conversions."]],
   "Skill & Badging":[["WEF Skill","Critical Thinking & Problem Solving","",0.86,"Conversion fluency under time → core problem-solving skill."],
     ["Badging Skill","Arithmetic Fluency","",0.95,"Feeds the Arithmetic Fluency badge (Mastery/Adept/Awareness)."]]},
  narrative:"Arithmetic fluency in conversion between fractions, decimals and percentages — ability to apply 'what' & 'how' knowledge of number operations to solve accurately under time constraints."},

 {id:"Q-10588",section:"Quant",sec:"q",
  stem:"A printing press produces 240 pages in 8 minutes. Working at the same rate, how many minutes will it take to produce 1,050 pages?",
  opts:"(A) 30  (B) 33  (C) 35  (D) 38.5  (E) 42",
  tags:{
   "Structural":[["Section","Quant","",0.99,"Numeric single-answer item → Quant."],
     ["Item Type","Problem Solving (A)","A",0.98,"5-option PS item."],
     ["Element Type","Single-skill (I)","I",0.85,"Primarily one applied-rate skill."]],
   "Content Classification":[["Content Domain","Arithmetic","ARI",0.92,"Rate/proportion computation → Arithmetic."],
     ["Subtopic","Applied (rate/interest/work)","APP",0.94,"Real-world rate-of-work scenario → APP."],
     ["Sub-subtopic","Rate","RAT",0.90,"Production rate → Cont3 RAT."]],
   "Cognitive Classification":[["Cognitive","Real (real-world context)","REA",0.96,"Embedded in a real-world printing scenario → REA."],
     ["Fundamental Skill","Quant Reasoning – Rates/Ratios","QRR",0.91,"Rate reasoning maps to QRR."]],
   "Skill & Badging":[["WEF Skill","Critical Thinking & Problem Solving","",0.83,"Model the scenario then compute → problem solving."],
     ["Badging Skill","Contextual Modeling & Decision-Oriented Problem Solving","",0.9,"Real-world modeling badge."]]},
  narrative:"Interpret real-world arithmetic models; infer contextual logic, model the problem, and adopt a decision-oriented approach to solve accurately under time constraints."},

 {id:"Q-10733",section:"Quant",sec:"q",
  stem:"If 2x² − 5x − 3 = 0 and x > 0, what is the value of x?",
  opts:"(A) 1/2  (B) 1  (C) 3/2  (D) 2  (E) 3",
  tags:{
   "Structural":[["Section","Quant","",0.99,"Equation-solving numeric item → Quant."],
     ["Item Type","Problem Solving (A)","A",0.98,"5-option PS item."],
     ["Element Type","Single-skill (I)","I",0.9,"Single algebra competency."]],
   "Content Classification":[["Content Domain","Algebra","ALG",0.96,"Solving a polynomial equation in x → Algebra."],
     ["Subtopic","Quadratic Equation","QEI",0.95,"Quadratic in standard form → QEI."],
     ["Sub-subtopic","—","–",0.88,"No Cont3 split."]],
   "Cognitive Classification":[["Cognitive","Pure (abstract maths)","PUR",0.93,"No real-world framing → PUR."],
     ["Fundamental Skill","Quant – Equations","QEU",0.9,"Equation manipulation cluster → QEU."]],
   "Skill & Badging":[["WEF Skill","Critical Thinking & Problem Solving","",0.84,"Abstract reasoning & manipulation."],
     ["Badging Skill","Algebra Fluency","",0.94,"Feeds Algebra Fluency badge."]]},
  narrative:"Algebraic fluency — apply 'what' & 'how' knowledge of equations and systems of equations to solve accurately under time constraints."},

 {id:"Q-10902",section:"Quant",sec:"q",
  stem:"A box contains 4 red, 5 blue, and 3 green marbles. If two are drawn at random without replacement, what is the probability both are blue?",
  opts:"(A) 5/33  (B) 5/36  (C) 1/6  (D) 5/12  (E) 25/144",
  tags:{
   "Structural":[["Section","Quant","",0.98,"Numeric probability item → Quant."],
     ["Item Type","Problem Solving (A)","A",0.97,"5-option PS item."],
     ["Element Type","Single-skill (I)","I",0.8,"Borderline — could be composite; flag for SME."]],
   "Content Classification":[["Content Domain","Arithmetic","ARI",0.86,"Counting/probability sits under ARI/P&S in codebook."],
     ["Subtopic","Probability & Statistics","P&S",0.93,"Without-replacement probability → P&S."],
     ["Sub-subtopic","—","–",0.72,"Combinatorics sub-code ambiguous (COU vs PRB)."]],
   "Cognitive Classification":[["Cognitive","Pure (abstract maths)","PUR",0.9,"Abstract scenario → PUR."],
     ["Fundamental Skill","Quant – Counting/Stats","QCS",0.88,"Probability cluster → QCS."]],
   "Skill & Badging":[["WEF Skill","Data Literacy & Analytical Reasoning","",0.82,"Probabilistic reasoning → data literacy."],
     ["Badging Skill","Probabilistic Reasoning & Data Literacy","",0.9,"Probability badge."]]},

<script id="apprender">
/* ====================== app helpers ====================== */
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("show");clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove("show"),2200);}
function confColor(c){return c>=0.85?"var(--green)":c>=0.7?"var(--amber)":"var(--red)";}
const CATS=["Structural","Content Classification","Cognitive Classification","Skill & Badging"];
const vocabFor=label=>{
  const m={"Section":VOCAB.section,"Item Type":VOCAB.itemType,"Element Type":Object.entries(VOCAB.elmType),
   "Content Domain":Object.entries(VOCAB.cont1),"Subtopic":Object.entries(VOCAB.cont2),

   "Fundamental Skill":Object.entries(VOCAB.fundSkill),"WEF Skill":WEF,"Badging Skill":VOCAB.badging};
  return m[label]||null;
};
/* tabs */
$$("#tabs button").forEach(b=>b.onclick=()=>{

/* ====================== OVERVIEW ====================== */

 $("#overview").innerHTML=`

 This platform runs an AI first pass over the whole bank — grounded strictly in the GMAC skills codebook (the
 <em>SkillSet Mapping</em> workbook) — then hands SMEs a review surface to verify or correct every tag, measures

 </div>

/* ====================== TAG REVIEW ====================== */
let SEL=0;
function progress(){let total=0,rev=0;ITEMS.forEach(it=>{total++;if(it.reviewed)rev++;});return{total,rev};}
function avgConf(it){let s=0,n=0;Object.values(it.tags).forEach(a=>a.forEach(t=>{s+=t[3];n++;}));return s/n;}
function minConf(it){let m=1;Object.values(it.tags).forEach(a=>a.forEach(t=>{if(t[3]<m)m=t[3];}));return m;}
function lowCount(it){let c=0;Object.values(it.tags).forEach(a=>a.forEach(t=>{if(t[3]<0.8)c++;}));return c;}

function renderReview(){
 const p=progress();
 const lowItems=ITEMS.filter(it=>lowCount(it)>0).length;
 $("#review").innerHTML=`
 <h2 class="section-title">Tag Review &amp; Edit</h2>
 <p class="sub">The AI first pass for every item, organized by category. Confidence and rationale are shown for each
 tag. Edit any field from the controlled codebook vocabulary, then approve or flag for a second look.</p>
 <div class="grid stat-row">
   <div class="card stat"><div class="k">Items in batch</div><div class="v">${p.total}</div></div>
   <div class="card stat"><div class="k">Reviewed</div><div class="v" id="revcount">${p.rev}<small>/${p.total}</small></div></div>
   <div class="card stat"><div class="k">Need attention</div><div class="v" style="color:var(--amber)">${lowItems}<small> low-confidence</small></div></div>
   <div class="card stat"><div class="k">Avg. confidence</div><div class="v">${Math.round(ITEMS.reduce((s,it)=>s+avgConf(it),0)/ITEMS.length*100)}%</div></div>
 </div>
 <div class="toolbar">
   <input type="search" id="search" placeholder="Search items by id or text…">
   <select id="fsec"><option value="">All sections</option><option>Quant</option><option>Verbal</option><option>Data Insights</option></select>
   <select id="fstatus"><option value="">All statuses</option><option value="unrev">Unreviewed</option><option value="rev">Reviewed</option><option value="low">Has low-confidence</option></select>
   <button class="btn ghost" id="bulkapprove">✓ Approve all high-confidence</button>
 </div>
 <div class="review-wrap">
   <div class="card itemlist" id="itemlist"></div>
   <div class="card detail" id="detail"></div>
 </div>`;
 $("#search").oninput=renderList;$("#fsec").onchange=renderList;$("#fstatus").onchange=renderList;
 $("#bulkapprove").onclick=()=>{let n=0;ITEMS.forEach(it=>{if(lowCount(it)===0&&!it.reviewed){it.reviewed=true;it.status="approved";n++;}});renderList();renderDetail();updateRevCount();toast(n+" high-confidence items approved");};
 renderList();renderDetail();
}
function updateRevCount(){const p=progress();const el=$("#revcount");if(el)el.innerHTML=`${p.rev}<small>/${p.total}</small>`;}
function filtered(){
 const q=($("#search")?.value||"").toLowerCase();const fs=$("#fsec")?.value||"";const st=$("#fstatus")?.value||"";
 return ITEMS.map((it,i)=>({it,i})).filter(({it})=>{
   if(q&&!(it.id.toLowerCase().includes(q)||it.stem.toLowerCase().includes(q)))return false;
   if(fs&&it.section!==fs)return false;
   if(st==="unrev"&&it.reviewed)return false;
   if(st==="rev"&&!it.reviewed)return false;
   if(st==="low"&&lowCount(it)===0)return false;
   return true;});
}
function renderList(){
 const list=$("#itemlist");if(!list)return;
 const rows=filtered();
 list.innerHTML=rows.map(({it,i})=>{
   const stat=it.reviewed?(it.status||"approved"):"ai";
   const lc=lowCount(it);
   return `<div class="itemrow ${i===SEL?'sel':''}" data-i="${i}">
     <div class="id">${it.id} <span class="pill ${it.sec}">${it.section}</span></div>
     <div class="stem">${esc(it.stem.replace(/\n/g,' '))}</div>
     <div class="meta">
       <span class="pill ${stat}">${stat==='ai'?'AI · unreviewed':stat}</span>
       ${lc?`<span class="pill flagged">${lc} low-conf</span>`:''}
       <span style="margin-left:auto;font-size:11px;color:var(--muted)">${Math.round(avgConf(it)*100)}%</span>
     </div></div>`;}).join("")||`<p style="padding:20px;color:var(--muted)">No items match.</p>`;
 $$("#itemlist .itemrow").forEach(r=>r.onclick=()=>{SEL=+r.dataset.i;renderList();renderDetail();});
}
function renderDetail(){
 const d=$("#detail");if(!d)return;const it=ITEMS[SEL];if(!it){d.innerHTML="";return;}
 let cats=CATS.map(cat=>{
   const rows=it.tags[cat].map((t,ti)=>{
     const[label,val,code,conf,why,status]=t;
     const vocab=vocabFor(label);
     let valHtml;
     if(vocab){
       const opts=vocab.map(o=>{const isPair=Array.isArray(o);const oc=isPair?o[0]:"";const ol=isPair?o[1]:o;
         const sel=(isPair? (oc===code||ol===val):(o===val))?"selected":"";
         return `<option value="${esc(ol)}" data-code="${esc(oc)}" ${sel}>${esc(ol)}${oc?` (${esc(oc)})`:""}</option>`;}).join("");
       valHtml=`<select data-cat="${cat}" data-ti="${ti}" class="tagedit">${opts}</select>`;
     } else { valHtml=`<span class="tagval">${esc(val)}</span>`; }
     const sp=status==="edited"?`<span class="pill edited" style="margin-left:6px">edited</span>`:"";
     return `<div class="tag">
        <div class="label">${esc(label)}</div>
        <div class="valwrap">${valHtml}${code?`<span class="code">${esc(code)}</span>`:""}${sp}</div>
        <div class="conf"><span class="confbar"><i style="width:${Math.round(conf*100)}%;background:${confColor(conf)}"></i></span><small>${Math.round(conf*100)}%</small></div>
        <div class="why">${esc(why)}</div>
      </div>`;}).join("");
   return `<div class="catblock"><h4><span class="ic"></span>${cat}</h4>${rows}</div>`;
 }).join("");
 const stat=it.reviewed?(it.status||"approved"):"ai · unreviewed";
 d.innerHTML=`
   <div class="qid">${it.id} · <span class="pill ${it.sec}">${it.section}</span> · <span class="pill ${it.reviewed?(it.status||'approved'):'ai'}">${stat}</span></div>
   <div class="stem-box">${esc(it.stem)}</div>
   <div class="opts">${esc(it.opts)}</div>
   ${cats}
   <div class="catblock"><h4><span class="ic" style="background:var(--violet)"></span>Item-level skill narrative</h4>
     <div class="narr">${esc(it.narrative)}</div></div>
   <div class="actionsbar">
     <button class="btn primary" id="approve">✓ Approve tags</button>
     <button class="btn danger" id="flag">⚑ Flag for review</button>
     <button class="btn ghost" id="reset">↺ Reset to AI</button>
     <button class="btn dark" id="viewqti" style="margin-left:auto">&lt;/&gt; Preview QTI writeback</button>
   </div>
   <div id="qtibox"></div>`;
 $$(".tagedit",d).forEach(s=>s.onchange=()=>{
   const cat=s.dataset.cat,ti=+s.dataset.ti;const opt=s.selectedOptions[0];
   const t=it.tags[cat][ti];t[1]=opt.value;t[2]=opt.dataset.code||"";t[3]=1;t[4]="Manually set by SME.";t[5]="edited";
   renderDetail();renderList();toast("Tag updated");
 });
 $("#approve").onclick=()=>{it.reviewed=true;it.status="approved";renderDetail();renderList();updateRevCount();toast("Item approved");};
 $("#flag").onclick=()=>{it.reviewed=true;it.status="flagged";renderDetail();renderList();updateRevCount();toast("Item flagged");};
 $("#reset").onclick=()=>{location.reload();};
 $("#viewqti").onclick=()=>{$("#qtibox").innerHTML=$("#qtibox").innerHTML?"":qtiPreview(it);};
}
function qtiPreview(it){
 const get=(cat,label)=>{const r=it.tags[cat].find(t=>t[0]===label);return r?r:["","","",0,""];};
 const cd=get("Content Classification","Content Domain"),st=get("Content Classification","Subtopic"),
   cg=get("Cognitive Classification","Cognitive"),wef=get("Skill & Badging","WEF Skill"),
   bg=get("Skill & Badging","Badging Skill"),el=get("Structural","Element Type");
 const C=(s)=>`<span class="v">${esc(s)}</span>`;
 return `<div style="margin-top:14px"><div class="note" style="margin-bottom:6px">Approved tags serialized into QTI 3.0 item metadata (IEEE-LOM classification + custom <span class="code">qti-metadata</span> vocabulary). Written back into the item's content-package manifest.</div>

  <span class="t">&lt;qti-metadata&gt;</span>
    <span class="t">&lt;gmac-classification</span> <span class="a">scheme</span>=${C('"content-domain"')} <span class="a">code</span>=${C('"'+cd[2]+'"')}<span class="t">&gt;</span>${C(cd[1])}<span class="t">&lt;/gmac-classification&gt;</span>
    <span class="t">&lt;gmac-classification</span> <span class="a">scheme</span>=${C('"subtopic"')} <span class="a">code</span>=${C('"'+st[2]+'"')}<span class="t">&gt;</span>${C(st[1])}<span class="t">&lt;/gmac-classification&gt;</span>
    <span class="t">&lt;gmac-classification</span> <span class="a">scheme</span>=${C('"cognitive"')} <span class="a">code</span>=${C('"'+cg[2]+'"')}<span class="t">&gt;</span>${C(cg[1])}<span class="t">&lt;/gmac-classification&gt;</span>

/* simulated golden set: per item, expected codes for key fields; preds derived from ITEMS */
const EVAL_FIELDS=["Content Domain","Subtopic","Cognitive","Element Type","WEF Skill","Badging Skill"];
function buildGolden(){
 // expected = AI value but with deliberate, realistic disagreements injected to make accuracy < 100%
 const disagree={ "D-30210":{"Subtopic":"P&S","Cognitive":"REA"}, "V-20502":{"Subtopic":"EVE"},
   "Q-10902":{"Sub-subtopic":"COU"}, "V-20114":{"Cognitive":"CST-EXP"}, "D-30781":{"Subtopic":"T"} };
 return ITEMS.map(it=>{
   const exp={};
   ["Content Classification","Cognitive Classification","Skill & Badging","Structural"].forEach(cat=>{
     it.tags[cat].forEach(t=>{ if(EVAL_FIELDS.includes(t[0])) exp[t[0]]=t[1]; });});
   const dd=disagree[it.id]||{};
   // store expected (with overrides) and predicted (raw AI)
   const pred={};EVAL_FIELDS.forEach(f=>pred[f]=exp[f]);
   Object.keys(dd).forEach(f=>{ if(EVAL_FIELDS.includes(f)){ /* map code->label via reverse lookup */
     exp[f]=codeToLabel(f,dd[f]); }});
   return {id:it.id,section:it.section,pred,exp};
 });
}
function codeToLabel(field,code){
 const map={"Subtopic":VOCAB.cont2,"Cognitive":VOCAB.cognitive};
 if(map[field]&&map[field][code])return map[field][code]+" ("+code+")";
 if(field==="Subtopic"&&code==="EVE")return "Everyday/Civic scenario (EVE)";
 if(field==="Subtopic"&&code==="P&S")return VOCAB.cont2["P&S"]+" (P&S)";
 if(field==="Subtopic"&&code==="T")return VOCAB.cont2["T"]+" (T)";
 if(field==="Cognitive"&&code==="REA")return VOCAB.cognitive["REA"]+" (REA)";
 if(field==="Cognitive"&&code==="CST-EXP")return "CR / Construction – Explanation (CST-EXP)";
 return code;
}
let EVAL_DATA=null;
function normalize(v){return (v||"").replace(/\s*\([^)]*\)\s*$/,"").trim().toLowerCase();}
function scoreEval(rows){
 const per={};EVAL_FIELDS.forEach(f=>per[f]={correct:0,total:0,mism:[]});
 rows.forEach(r=>{EVAL_FIELDS.forEach(f=>{ if(r.exp[f]===undefined)return;
   per[f].total++; const ok=normalize(r.pred[f])===normalize(r.exp[f]);
   if(ok)per[f].correct++; else per[f].mism.push({id:r.id,pred:r.pred[f],exp:r.exp[f]});});});
 let c=0,t=0;Object.values(per).forEach(p=>{c+=p.correct;t+=p.total;});
 return {per,overall:t?c/t:0,correct:c,total:t};
}
function renderEvals(){
 $("#evals").innerHTML=`
 <h2 class="section-title">Evaluation &amp; Accuracy</h2>
 <p class="sub">SMEs upload a golden set (items with expected tags). The harness compares the AI's tags field-by-field,
 reports per-field and overall accuracy, lists every mismatch, and gates batch expansion against the 0.85 threshold
 agreed in the kickoff.</p>
 <div class="uploadbox">
   <div style="font-size:30px">📥</div>
   <h3>Upload golden dataset</h3>
   <p style="color:var(--muted);max-width:560px;margin:0 auto 12px">CSV with columns: <span class="code">item_id, field, expected_value</span>
     (long format) — or click below to run against the built-in sample golden set for this batch.</p>
   <input type="file" id="goldfile" accept=".csv" style="display:none">
   <button class="btn ghost" onclick="document.getElementById('goldfile').click()">Choose CSV…</button>
   <button class="btn primary" id="runsample">▶ Run sample golden set</button>
 </div>
 <div id="evalresults"></div>`;
 $("#runsample").onclick=()=>{EVAL_DATA=buildGolden();showEval(scoreEval(EVAL_DATA),EVAL_DATA);};

function handleCSV(e){
 const f=e.target.files[0];if(!f)return;const rd=new FileReader();
 rd.onload=()=>{
   try{
     const lines=rd.result.split(/\r?\n/).filter(x=>x.trim());
     const head=lines[0].split(",").map(h=>h.trim().toLowerCase());
     const idx={id:head.indexOf("item_id"),field:head.indexOf("field"),exp:head.indexOf("expected_value")};
     if(idx.id<0||idx.field<0||idx.exp<0){toast("CSV needs item_id, field, expected_value columns");return;}
     // build exp map per id
     const byId={};lines.slice(1).forEach(l=>{const c=l.split(",");const id=c[idx.id]?.trim();
       if(!id)return;byId[id]=byId[id]||{};byId[id][c[idx.field].trim()]=c[idx.exp].trim();});
     const rows=ITEMS.filter(it=>byId[it.id]).map(it=>{
       const pred={};EVAL_FIELDS.forEach(fd=>{["Content Classification","Cognitive Classification","Skill & Badging","Structural"].forEach(cat=>{
         it.tags[cat].forEach(t=>{if(t[0]===fd)pred[fd]=t[1];});});});
       return {id:it.id,section:it.section,pred,exp:byId[it.id]};});
     if(!rows.length){toast("No matching item_ids found in this batch");return;}
     EVAL_DATA=rows;showEval(scoreEval(rows),rows);toast("Scored "+rows.length+" items from CSV");
   }catch(err){toast("Could not parse CSV");}
 };rd.readAsText(f);
}
function showEval(res,rows){
 const pct=res.overall*100;const pass=res.overall>=0.85;
 const fieldBars=EVAL_FIELDS.map(f=>{const p=res.per[f];if(!p.total)return"";const a=p.correct/p.total;
   return `<div class="fieldbar"><div>${esc(f)}</div>
     <div class="bar"><i style="width:${Math.round(a*100)}%;background:${confColor(a)}"></i></div>
     <div class="acc-num" style="color:${confColor(a)}">${Math.round(a*100)}%</div></div>`;}).join("");
 const mism=[];EVAL_FIELDS.forEach(f=>res.per[f].mism.forEach(m=>mism.push({field:f,...m})));
 const mrows=mism.map(m=>`<tr><td>${m.id}</td><td>${esc(m.field)}</td>
   <td class="bad">${esc(m.pred)}</td><td class="ok">${esc(m.exp)}</td></tr>`).join("")
   ||`<tr><td colspan="4" style="color:var(--green)">No mismatches — perfect agreement.</td></tr>`;
 const secAgg={};rows.forEach(r=>{secAgg[r.section]=secAgg[r.section]||{c:0,t:0};
   EVAL_FIELDS.forEach(f=>{if(r.exp[f]===undefined)return;secAgg[r.section].t++;if(normalize(r.pred[f])===normalize(r.exp[f]))secAgg[r.section].c++;});});
 const secCards=Object.entries(secAgg).map(([s,v])=>{const a=v.c/v.t;
   return `<div class="card stat"><div class="k">${esc(s)}</div><div class="v" style="color:${confColor(a)}">${Math.round(a*100)}%</div><div class="note">${v.c}/${v.t} fields</div></div>`;}).join("");
 $("#evalresults").innerHTML=`
   <div class="gate ${pass?'pass':'fail'}">
     <span class="big">${pass?'✓':'✕'}</span>
     <div><div>Overall accuracy <b>${pct.toFixed(1)}%</b> (${res.correct}/${res.total} fields) —
       ${pass?'clears':'below'} the 0.85 gate. ${pass?'Cleared to expand to the next batch.':'Refine prompts / few-shot examples and re-run before scaling.'}</div></div>
   </div>
   <div class="grid eval-grid" style="margin-bottom:20px">
     <div class="card stat"><div class="k">Items scored</div><div class="v">${rows.length}</div></div>
     <div class="card stat"><div class="k">Fields scored</div><div class="v">${res.total}</div></div>
     <div class="card stat"><div class="k">Mismatches</div><div class="v" style="color:var(--amber)">${mism.length}</div></div>
     <div class="card stat"><div class="k">Gate</div><div class="v" style="color:${pass?'var(--green)':'var(--red)'}">${pass?'PASS':'FAIL'}</div></div>
   </div>
   <div class="grid col2" style="margin-bottom:20px">
     <div class="card" style="padding:18px"><h4 style="margin:0 0 12px;font-size:13px">Accuracy by field</h4>${fieldBars}</div>
     <div class="card" style="padding:18px"><h4 style="margin:0 0 12px;font-size:13px">Accuracy by section</h4>
       <div class="grid" style="grid-template-columns:1fr 1fr 1fr;gap:10px">${secCards}</div>
       <p class="note">Weakest field gates the rollout — here cognitive &amp; subtopic edge cases (DS pure/real, CR explain-vs-construct, civic-vs-business context) are the recurring disagreements to refine.</p></div>
   </div>
   <div class="card" style="padding:18px">
     <h4 style="margin:0 0 12px;font-size:13px">Mismatches (AI prediction vs SME-expected)</h4>
     <table class="cm"><thead><tr><th>Item</th><th>Field</th><th>AI predicted</th><th>SME expected</th></tr></thead><tbody>${mrows}</tbody></table>
   </div>`;
 $("#evalresults").scrollIntoView({behavior:"smooth",block:"nearest"});
}
